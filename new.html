<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アサイン</title>
<style>
:root{
  --ink:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--bg:#f2f2f7;--card:#fff;
  --field:#f2f2f7;--ok:#34c759;--warn:#ff9500;--off:#f7f7f9;
  --nav-h:36px;--head-h:44px;--fix-h:25vh;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;text-align:left;}
input,textarea,select,button{font-family:inherit;font-size:16px;text-align:left;}
button{cursor:pointer;border:none;background:none;color:inherit;}
.hide{display:none!important;}
/* ===== 案件一覧 ===== */
#viewList{height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.listHead{height:var(--head-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);}
.listHead .title{font-weight:600;font-size:16px;}
.listHead .newBtn{padding:6px 12px;background:var(--ok);color:#fff;border-radius:8px;font-size:13px;font-weight:600;}
.filterBar{padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;}
.filterBar .chip{padding:4px 10px;font-size:12px;background:var(--off);border-radius:14px;white-space:nowrap;}
.filterBar .chip.on{background:var(--ink);color:#fff;}
.caseList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px;}
.caseCard{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.caseCard .cName{font-weight:600;font-size:14px;margin-bottom:2px;}
.caseCard .cMeta{font-size:11px;color:var(--sub);}
.caseCard.pinned{border-left:3px solid var(--warn);}
.listLoading{text-align:center;color:var(--sub);padding:40px;font-size:13px;}
/* ===== 案件詳細 ===== */
#viewCase{height:100vh;display:flex;flex-direction:column;background:var(--bg);}
/* ヘッダー（折りたたみ可能） */
.caseHead{
  height:var(--head-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);
  overflow:hidden;
  transition:height .18s ease, border .18s ease;
}
.caseHead.collapsed{
  height:0!important;
  border-bottom:0!important;
}
.caseHead .back{font-size:22px;color:var(--sub);padding:4px 8px;}
.caseHead .ttl{flex:1;text-align:center;overflow:hidden;}
.caseHead .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.caseHead .st{font-size:10px;color:var(--sub);margin-top:1px;}
.caseHead .st.dirty{color:var(--warn);}
.caseHead .st.saved{color:var(--ok);}
.caseHead .saveBtn{padding:6px 12px;background:var(--ok);color:#fff;border-radius:8px;font-size:13px;font-weight:600;}
.caseHead .saveBtn.dirty{background:var(--warn);}
/* ナビバー */
.navbar{
  height:var(--nav-h);
  display:flex;align-items:center;
  background:var(--card);border-bottom:1px solid var(--line);
  padding:0 4px;gap:2px;
  position:relative;z-index:5;
}
.navtabs{display:flex;flex:1;gap:2px;overflow-x:auto;}
.navtab{
  padding:4px 8px;font-size:11px;color:var(--sub);
  border-radius:6px;white-space:nowrap;
}
.navtab.active{background:var(--ink);color:#fff;}
.navRight{display:flex;gap:2px;flex-shrink:0;}
.navAllBtn,.headShowBtn{
  padding:4px 8px;font-size:11px;color:var(--sub);
  border-radius:6px;background:var(--off);
}
.headShowBtn{display:none;}
.caseHead.collapsed ~ .caseWrap .headShowBtn{display:block;}
/* 本体スクロール領域 */
.caseWrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.scrollArea{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px;}
/* 各ブロック共通 */
.block{background:var(--card);border-bottom:1px solid var(--line);}
.blockBody{padding:10px 12px;}
.block:not(.open) .blockBody{display:none;}
/* ⓪原文（開いている時 1/4 固定・上部スティッキー） */
#paneRaw{position:relative;}
#paneRaw.open{
  position:sticky;top:0;z-index:3;
  height:var(--fix-h);
  background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;
}
#paneRaw.open .blockBody{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
}
#rawHistory{
  font-size:12px;line-height:1.5;color:var(--sub);white-space:pre-wrap;
  max-height:45%;overflow-y:auto;padding:6px 8px;background:var(--off);
  border-radius:6px;margin-bottom:6px;
}
#rawAddLabel{font-size:11px;color:var(--sub);margin-bottom:4px;}
#rawText{
  flex:1;width:100%;border:0;background:var(--field);border-radius:6px;
  font-size:13px;line-height:1.5;color:var(--ink);
  resize:none;padding:8px;min-height:60px;
}
/* ③LINE文（開いている時 下部固定、⓪状態で高さ変化） */
#paneGen{position:relative;}
#paneGen.open{
  position:sticky;bottom:0;z-index:3;
  background:var(--card);
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;
  /* ⓪が開いている時：1/4、⓪が閉じている時：拡張。ただし最低1/4は確保 */
  min-height:var(--fix-h);
  max-height:50vh;
}
body.rawOpen #paneGen.open{
  height:var(--fix-h);
  max-height:var(--fix-h);
}
body:not(.rawOpen) #paneGen.open{
  height:auto;
  min-height:var(--fix-h);
}
#paneGen.open .blockBody{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
/* 中央ブロック（①②④）*/
#block1,#block2,#block4{}
/* フィールド */
.lineRow{display:flex;align-items:center;gap:8px;padding:6px 0;}
.lineRow .lbl{width:56px;font-size:12px;color:var(--sub);flex-shrink:0;}
.lineRow .val{flex:1;}
.field{
  width:100%;padding:8px 10px;background:var(--field);border:0;border-radius:8px;
  font-size:15px;
}
select.field{-webkit-appearance:none;appearance:none;}
textarea.field{min-height:80px;resize:vertical;font-family:inherit;line-height:1.5;}
.fieldHint{font-size:10px;color:var(--sub);margin-top:2px;}
.dateDisplay{
  flex:1;padding:8px 10px;background:var(--field);border-radius:8px;
  font-size:14px;min-height:36px;cursor:pointer;
}
.dateDisplay.empty{color:var(--sub);}
.timeRow{display:flex;align-items:center;gap:6px;padding:6px 0;}
.timeRow .lbl{width:56px;font-size:12px;color:var(--sub);flex-shrink:0;}
.timeRow input[type=time]{
  flex:1;padding:8px 10px;background:var(--field);border:0;border-radius:8px;
  font-size:15px;min-width:0;
}
.timeRow .sep{color:var(--sub);font-size:13px;}
.irrAdd{
  width:32px;height:32px;background:var(--off);border-radius:8px;
  font-size:16px;color:var(--sub);flex-shrink:0;
}
.irrList{padding:4px 0 0 56px;}
.irrItem{display:flex;align-items:center;gap:4px;padding:4px 0;font-size:12px;color:var(--sub);}
.irrItem .del{padding:2px 6px;color:var(--warn);}
/* ②単価 */
.priceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.priceCell{background:var(--field);border-radius:8px;padding:8px;}
.priceCell .plbl{font-size:11px;color:var(--sub);margin-bottom:4px;}
.priceCell input{width:100%;padding:6px 8px;background:var(--card);border:0;border-radius:6px;font-size:14px;}
/* ③向け先＋追加費用 */
.targetRow{display:flex;align-items:center;gap:6px;padding:4px 0;}
.targetRow .lbl{width:52px;font-size:11px;color:var(--sub);flex-shrink:0;}
.targetPick{display:flex;gap:4px;flex-wrap:wrap;}
.targetPick .tp{
  padding:4px 8px;font-size:11px;background:var(--off);
  border-radius:6px;color:var(--sub);
}
.targetPick .tp.on{background:var(--ink);color:#fff;}
.extras{display:flex;align-items:center;gap:12px;padding:4px 0;flex-wrap:wrap;}
.extras .lbl{width:52px;font-size:11px;color:var(--sub);flex-shrink:0;}
.extra{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink);}
.extra input[type=checkbox]{width:18px;height:18px;margin:0;}
.extra input[type=number]{
  width:48px;padding:2px 4px;background:var(--field);border:0;border-radius:4px;
  font-size:12px;text-align:right;
}
.genPreview{
  margin-top:6px;padding:8px;background:var(--off);border-radius:6px;
  font-size:12px;line-height:1.5;white-space:pre-wrap;color:var(--ink);
  font-family:inherit;
}
.genNote{font-size:10px;color:var(--sub);margin-top:4px;}
/* ④アサイン */
.assignHint{font-size:12px;color:var(--sub);padding:8px 0;}
/* カレンダーモーダル */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;
  display:none;align-items:center;justify-content:center;
}
.modal.open{display:flex;}
.modalBox{background:var(--card);border-radius:12px;padding:16px;width:88%;max-width:340px;}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.modalHead .mt{font-weight:600;font-size:15px;}
.modalHead .mc{font-size:20px;color:var(--sub);padding:0 4px;}
.calNav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.calNav button{font-size:18px;color:var(--sub);padding:4px 10px;}
.calNav .cm{font-weight:600;font-size:14px;}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.calGrid .dow{font-size:10px;color:var(--sub);text-align:center;padding:4px 0;}
.calGrid .d{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:13px;border-radius:6px;background:var(--off);
}
.calGrid .d.other{color:var(--sub);opacity:.4;}
.calGrid .d.sel{background:var(--ink);color:#fff;}
.calGrid .d.today{outline:1px solid var(--ok);}
.calGrid .d.empty{background:transparent;}
.modalFoot{display:flex;justify-content:flex-end;margin-top:12px;}
.modalFoot .ok{padding:8px 16px;background:var(--ok);color:#fff;border-radius:8px;font-size:13px;font-weight:600;}
</style>
</head>
<body>
<!-- ===== 案件一覧 ===== -->
<div id="viewList">
  <div class="listHead">
    <div class="title">案件</div>
    <button class="newBtn" onclick="newCase()">＋新規</button>
  </div>
  <div class="filterBar" id="filterBar"></div>
  <div class="caseList" id="caseList"></div>
</div>
<!-- ===== 案件詳細 ===== -->
<div id="viewCase" class="hide">
  <div class="caseHead" id="caseHead">
    <button class="back" onclick="backToList()">‹</button>
    <div class="ttl">
      <div class="name" id="hName">—</div>
      <div class="st" id="hSt">保存済み</div>
    </div>
    <button class="saveBtn" id="saveBtn" onclick="save()">保存</button>
  </div>
  <div class="caseWrap">
    <div class="navbar">
      <div class="navtabs" id="navtabs">
        <button class="navtab" data-target="paneRaw" onclick="toggleBlock('paneRaw')">⓪原文</button>
        <button class="navtab active" data-target="block1" onclick="toggleBlock('block1')">①詳細</button>
        <button class="navtab" data-target="block2" onclick="toggleBlock('block2')">②単価</button>
        <button class="navtab" data-target="paneGen" onclick="toggleBlock('paneGen')">③LINE文</button>
        <button class="navtab" data-target="block4" onclick="toggleBlock('block4')">④アサイン</button>
      </div>
      <div class="navRight">
        <button class="headShowBtn" onclick="showHead()">△</button>
        <button class="navAllBtn" id="navAllBtn" onclick="toggleAll()">全開</button>
        <button class="navAllBtn" onclick="hideHead()" title="ヘッダー折りたたみ">▽</button>
      </div>
    </div>
    <div class="scrollArea" id="scrollArea">
      <!-- ⓪原文（既存案件を開いた時だけ使う。新規作成時は使わない） -->
      <div class="block" id="paneRaw">
        <div class="blockBody">
          <div id="rawHistory"></div>
          <div id="rawAddLabel">↓追記する内容があれば貼り付け（保存すると下に追記されます）</div>
          <textarea id="rawText" placeholder="追記するLINE原文など" oninput="onRawChange()"></textarea>
        </div>
      </div>
      <!-- ①案件詳細 -->
      <div class="block open" id="block1">
        <div class="blockBody">
          <div class="lineRow" id="rowClient">
            <span class="lbl">送り先</span>
            <div class="val"><select class="field" id="dClient"></select></div>
          </div>
          <div class="lineRow">
            <span class="lbl">案件名</span>
            <div class="val"><input class="field" id="dName" oninput="onDetailChange()"></div>
          </div>
          <div class="lineRow">
            <span class="lbl">場所</span>
            <div class="val"><input class="field" id="dPlace" oninput="onDetailChange()"></div>
          </div>
          <div class="lineRow">
            <span class="lbl">日程</span>
            <div id="dDatesDisplay" class="dateDisplay empty" onclick="openCalModal()">タップして選択</div>
          </div>
          <div class="timeRow">
            <span class="lbl">時間</span>
            <input type="time" id="dTimeStart" oninput="onDetailChange()" onchange="onDetailChange()">
            <span class="sep">〜</span>
            <input type="time" id="dTimeEnd" oninput="onDetailChange()" onchange="onDetailChange()">
            <button class="irrAdd" onclick="addIrregular()">＋</button>
          </div>
          <div class="irrList" id="irrList"></div>
          <div class="lineRow" id="rowPeople">
            <span class="lbl">人数</span>
            <div class="val"><input class="field" id="dPeople" placeholder="女性ST2名（〇）" oninput="onDetailChange()"></div>
          </div>
          <div class="lineRow" id="rowWear">
            <span class="lbl">衣装</span>
            <div class="val"><input class="field" id="dWear" oninput="onDetailChange()"></div>
          </div>
          <div class="lineRow" id="rowJob" style="align-items:flex-start;">
            <span class="lbl" style="padding-top:8px;">仕事内容</span>
            <div class="val"><textarea class="field" id="dJob" placeholder="1行に1項目" oninput="onDetailChange()"></textarea></div>
          </div>
        </div>
      </div>
      <!-- ②単価（新規作成時のみ。既存案件の単価編集は今回未対応） -->
      <div class="block" id="block2">
        <div class="blockBody">
          <div class="priceGrid">
            <div class="priceCell">
              <div class="plbl">自社 請求</div>
              <input type="number" id="p_self_bill" oninput="onDetailChange()">
            </div>
            <div class="priceCell">
              <div class="plbl">ZERO 請求</div>
              <input type="number" id="p_zero_bill" oninput="onDetailChange()">
            </div>
            <div class="priceCell">
              <div class="plbl">ハン 請求</div>
              <input type="number" id="p_han_bill" oninput="onDetailChange()">
            </div>
            <div class="priceCell">
              <div class="plbl">その他 請求</div>
              <input type="number" id="p_other_bill" oninput="onDetailChange()">
            </div>
          </div>
        </div>
      </div>
      <!-- ③LINE文 -->
      <div class="block" id="paneGen">
        <div class="blockBody">
          <div class="targetRow">
            <span class="lbl">向け先</span>
            <div class="targetPick" id="targetPick">
              <button class="tp on" data-t="self" onclick="pickTarget('self')">自社</button>
              <button class="tp" data-t="zero" onclick="pickTarget('zero')">ZERO</button>
              <button class="tp" data-t="han" onclick="pickTarget('han')">ハン</button>
              <button class="tp" data-t="other" onclick="pickTarget('other')">その他</button>
            </div>
          </div>
          <div class="extras">
            <span class="lbl">追加</span>
            <label class="extra">
              <input type="checkbox" id="exFood" onchange="renderGen()">
              食費<input type="number" id="exFoodAmt" value="1000" oninput="renderGen()">円/日
            </label>
            <label class="extra">
              <input type="checkbox" id="exTrans" onchange="renderGen()">
              交通<input type="number" id="exTransAmt" value="1000" oninput="renderGen()">円/日
            </label>
          </div>
          <pre class="genPreview" id="genPreview">—</pre>
          <div class="genNote" id="genNote">※これはプレビューです。新規作成時は保存後に確定した文章に差し替わります。</div>
        </div>
      </div>
      <!-- ④アサイン -->
      <div class="block" id="block4">
        <div class="blockBody">
          <div class="assignHint">アサイン編集は今回スルー（後日実装）</div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- カレンダーモーダル -->
<div class="modal" id="calModal">
  <div class="modalBox">
    <div class="modalHead">
      <div class="mt">日程を選択</div>
      <button class="mc" onclick="closeCalModal()">×</button>
    </div>
    <div class="calNav">
      <button onclick="calMove(-1)">‹</button>
      <div class="cm" id="calMonth">—</div>
      <button onclick="calMove(1)">›</button>
    </div>
    <div class="calGrid" id="calGrid"></div>
    <div class="modalFoot">
      <button class="ok" onclick="confirmCal()">完了</button>
    </div>
  </div>
</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzX7Pzhq2TFFOHCr0saeHG7qeWA5PuBptUe4-kAtzj-kYWIkJE7z7F1vkvkAMEUzQpPcA/exec';

// ===== 状態 =====
let CASES=[];
let MODE='create';    // 'create'(新規作成) | 'edit'(既存編集)
let CUR=null;          // 既存編集モード時：{settings,slots,rawText,masters}
let CUR_SSID=null;     // 既存編集モード時：対象SS_ID
let CUR_TAB=null;      // 既存編集モード時：対象タブ名
let CUR_ID=null;       // 一覧・キャッシュ用のキー = ssId + '::' + tabName
let DIRTY=false;
let SEL_DATES=[];      // ['2026-06-19','2026-06-20'...] 内部はISO
let IRR=[];            // イレギュラー [{date:'YYYY-MM-DD',start:'HH:MM',end:'HH:MM'}]
let TARGET='self';
let FILTER_CLIENT='ALL';
let CAL_TMP=[];        // カレンダー編集中の一時
let CAL_YM={y:0,m:0};  // カレンダー表示中の年月
let MASTERS=null;      // getMastersのキャッシュ（クライアント一覧など）

// ===== GAS通信共通ヘルパー =====
// ★必ずPOST＋Content-Type:text/plainで送る（CORSプリフライト回避のため）。
//   GETはdoGet側でアクション振り分けをしていないため使わないこと。
function postGAS(obj){
  return fetch(GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(obj),
    redirect:'follow'
  }).then(r=>r.json());
}

// ===== 一覧 =====
function loadCaseList(){
  try{
    const c=localStorage.getItem('caseList');
    if(c){CASES=JSON.parse(c);renderList();}
  }catch(e){}
  postGAS({action:'getCaseList'}).then(d=>{
    if(d.ok){
      CASES=(d.cases||[]).map(c=>Object.assign({id:c.ssId+'::'+c.tabName},c));
      localStorage.setItem('caseList',JSON.stringify(CASES));
      renderList();
    }
  }).catch(()=>{
    if(!CASES.length){
      document.getElementById('caseList').innerHTML='<div class="listLoading">読み込みに失敗しました。電波の良い所で開き直してください。</div>';
    }
  });
}
function renderList(){
  const clients=[...new Set(CASES.map(c=>c.client||'—'))];
  const fb=document.getElementById('filterBar');
  fb.innerHTML='<button class="chip '+(FILTER_CLIENT==='ALL'?'on':'')+'" onclick="setFilter(\'ALL\')">全部</button>'+
    clients.map(cl=>`<button class="chip ${FILTER_CLIENT===cl?'on':''}" onclick="setFilter('${cl}')">${cl}</button>`).join('');
  const list=CASES.filter(c=>FILTER_CLIENT==='ALL'||c.client===FILTER_CLIENT)
    .sort((a,b)=>{
      if(!!a.pinned!==!!b.pinned)return b.pinned?1:-1;
      // ※日付は表示文字列("6/19(金)・6/20(土)"等)での比較のため、月をまたぐ案件が
      //   混在すると厳密な時系列にならない場合があります(既知の制限)。
      return (b.dates||'').localeCompare(a.dates||'');
    });
  document.getElementById('caseList').innerHTML=list.map(c=>
    `<div class="caseCard ${c.pinned?'pinned':''}" onclick="openCase('${c.id}')">
      <div class="cName">${c.caseName||'(無題)'}</div>
      <div class="cMeta">${c.client||''} ・ ${c.dates||''}</div>
    </div>`).join('')||'<div class="listLoading">案件がありません</div>';
}
function setFilter(c){FILTER_CLIENT=c;renderList();}

// ===== 既存案件を開く =====
function openCase(id){
  MODE='edit';
  const idx=id.indexOf('::');
  CUR_SSID=id.substring(0,idx);
  CUR_TAB=id.substring(idx+2);
  CUR_ID=id;
  // キャッシュから即表示
  try{
    const c=localStorage.getItem('case_'+id);
    if(c){CUR=JSON.parse(c);buildAll();}
  }catch(e){}
  document.getElementById('viewList').classList.add('hide');
  document.getElementById('viewCase').classList.remove('hide');
  // 裏で最新取得
  postGAS({action:'getCase',ssId:CUR_SSID,tabName:CUR_TAB}).then(d=>{
    if(d.ok&&d.data){
      CUR=d.data;
      localStorage.setItem('case_'+id,JSON.stringify(CUR));
      buildAll();
    }
  }).catch(()=>{});
}
function backToList(){
  document.getElementById('viewCase').classList.add('hide');
  document.getElementById('viewList').classList.remove('hide');
  loadCaseList();
}
function newCase(){
  MODE='create';
  CUR_SSID=null;CUR_TAB=null;CUR_ID=null;CUR=null;
  SEL_DATES=[];IRR=[];TARGET='self';DIRTY=false;
  buildAll();
  document.getElementById('viewList').classList.add('hide');
  document.getElementById('viewCase').classList.remove('hide');
}

// ===== クライアント選択（新規作成モード用） =====
function populateClientPicker(){
  const sel=document.getElementById('dClient');
  if(MASTERS){ fillClientSelect(sel); return; }
  sel.innerHTML='<option value="">読み込み中…</option>';
  postGAS({action:'getMasters'}).then(d=>{
    if(d.ok){ MASTERS=d.masters; fillClientSelect(sel); }
    else{ sel.innerHTML='<option value="">取得失敗</option>'; }
  }).catch(()=>{ sel.innerHTML='<option value="">通信エラー</option>'; });
}
function fillClientSelect(sel){
  const clients=(MASTERS&&MASTERS.clients)||[];
  sel.innerHTML=clients.length
    ? clients.map(c=>`<option value="${c.mention}">${c.name}</option>`).join('')
    : '<option value="">クライアント未登録</option>';
}

// ===== モードに応じた表示切替 =====
function applyModeVisibility(){
  const isEdit = MODE==='edit';
  document.getElementById('rowClient').style.display = isEdit?'none':'flex';
  document.getElementById('rowPeople').style.display = isEdit?'none':'flex';
  document.getElementById('rowWear').style.display = isEdit?'none':'flex';
  document.getElementById('rowJob').style.display = isEdit?'none':'flex';

  const tab2=document.querySelector('.navtab[data-target="block2"]');
  const tab0=document.querySelector('.navtab[data-target="paneRaw"]');
  if(isEdit){
    tab2.classList.add('hide');
    document.getElementById('block2').classList.remove('open');
    tab0.classList.remove('hide');
  }else{
    tab2.classList.remove('hide');
    tab0.classList.add('hide');
    document.getElementById('paneRaw').classList.remove('open');
  }
  document.body.classList.toggle('rawOpen',document.getElementById('paneRaw').classList.contains('open'));
  updateNavActive();
}

// ===== データ描画 =====
function buildAll(){
  const isEdit = MODE==='edit';

  if(isEdit && CUR){
    document.getElementById('hName').textContent=CUR.settings.caseName||'(無題)';
    document.getElementById('dName').value=CUR.settings.caseName||'';
    document.getElementById('dPlace').value=CUR.settings.area||'';

    // 時間は "09:00〜21:00" 形式なら分解して初期値に。それ以外は空のまま。
    const tm=(CUR.settings.time||'').match(/^(\d{2}:\d{2})[〜~-](\d{2}:\d{2})$/);
    document.getElementById('dTimeStart').value=tm?tm[1]:'';
    document.getElementById('dTimeEnd').value=tm?tm[2]:'';

    // 日程は文字列でしか持っていないため、そのままでは再選択できない。
    // 変更したい時だけカレンダーで選び直す運用にする。
    SEL_DATES=[];
    updateDatesDisplay(CUR.settings.dates||'');

    IRR=[];renderIrr();

    document.getElementById('rawHistory').textContent=CUR.rawText||'(原文の記録はまだありません)';
    document.getElementById('rawText').value='';
  }else{
    document.getElementById('hName').textContent=document.getElementById('dName').value||'(無題)';
    document.getElementById('dName').value='';
    document.getElementById('dPlace').value='';
    SEL_DATES=[];updateDatesDisplay();
    document.getElementById('dTimeStart').value='';
    document.getElementById('dTimeEnd').value='';
    IRR=[];renderIrr();
    document.getElementById('dPeople').value='';
    document.getElementById('dWear').value='';
    document.getElementById('dJob').value='';
    populateClientPicker();
  }

  // 単価（新規作成モードのみ使用）
  document.getElementById('p_self_bill').value='';
  document.getElementById('p_zero_bill').value='';
  document.getElementById('p_han_bill').value='';
  document.getElementById('p_other_bill').value='';

  document.getElementById('genNote').style.display = isEdit ? 'none' : 'block';

  DIRTY=false;updateSaveState();
  applyModeVisibility();
  renderGen();
}

// ===== 日程表示 =====
function updateDatesDisplay(existingStr){
  const el=document.getElementById('dDatesDisplay');
  if(SEL_DATES.length){
    el.textContent=SEL_DATES.map(fmtDateJP).join('、');
    el.classList.remove('empty');
  }else if(existingStr){
    el.textContent=existingStr+'（変更する場合はタップして選び直し）';
    el.classList.add('empty');
  }else{
    el.textContent='タップして選択';
    el.classList.add('empty');
  }
}
function fmtDateJP(iso){
  // 'YYYY-MM-DD' → 'M/D(曜)'
  const d=new Date(iso+'T00:00');
  if(isNaN(d))return iso;
  const w=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w})`;
}

// ===== カレンダーモーダル =====
function openCalModal(){
  CAL_TMP=SEL_DATES.slice();
  const now=SEL_DATES[0]?new Date(SEL_DATES[0]+'T00:00'):new Date();
  CAL_YM={y:now.getFullYear(),m:now.getMonth()};
  renderCal();
  document.getElementById('calModal').classList.add('open');
}
function closeCalModal(){document.getElementById('calModal').classList.remove('open');}
function calMove(d){
  CAL_YM.m+=d;
  if(CAL_YM.m<0){CAL_YM.m=11;CAL_YM.y--;}
  if(CAL_YM.m>11){CAL_YM.m=0;CAL_YM.y++;}
  renderCal();
}
function renderCal(){
  const {y,m}=CAL_YM;
  document.getElementById('calMonth').textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const startDow=first.getDay();
  const days=last.getDate();
  const today=new Date();const todayS=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let html=['日','月','火','水','木','金','土'].map(w=>`<div class="dow">${w}</div>`).join('');
  for(let i=0;i<startDow;i++)html+='<div class="d empty"></div>';
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sel=CAL_TMP.includes(iso);
    const tod=iso===todayS;
    html+=`<div class="d ${sel?'sel':''} ${tod?'today':''}" onclick="pickCal('${iso}')">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
function pickCal(iso){
  const i=CAL_TMP.indexOf(iso);
  if(i>=0)CAL_TMP.splice(i,1);else CAL_TMP.push(iso);
  CAL_TMP.sort();
  renderCal();
}
function confirmCal(){
  SEL_DATES=CAL_TMP.slice();
  updateDatesDisplay();
  onDetailChange();
  closeCalModal();
}

// ===== イレギュラー =====
function renderIrr(){
  document.getElementById('irrList').innerHTML=IRR.map((r,i)=>
    `<div class="irrItem">
      <span>※ ${fmtDateJP(r.date)} ${r.start}〜${r.end}</span>
      <button class="del" onclick="delIrr(${i})">×</button>
    </div>`).join('');
}
function addIrregular(){
  if(!SEL_DATES.length){alert('先に日程を選択してください');return;}
  IRR.push({date:SEL_DATES[0],start:'10:00',end:'21:30'});
  renderIrr();onDetailChange();
}
function delIrr(i){IRR.splice(i,1);renderIrr();onDetailChange();}

// ===== ナビ・ブロック開閉 =====
function toggleBlock(id){
  const el=document.getElementById(id);
  if(el.classList.contains('hide'))return;
  el.classList.toggle('open');
  document.body.classList.toggle('rawOpen',document.getElementById('paneRaw').classList.contains('open'));
  updateNavActive();
}
function updateNavActive(){
  document.querySelectorAll('.navtab').forEach(t=>{
    const tgt=t.dataset.target;
    t.classList.toggle('active',document.getElementById(tgt).classList.contains('open'));
  });
  const ids=['paneRaw','block1','block2','paneGen','block4'].filter(id=>{
    const tab=document.querySelector('.navtab[data-target="'+id+'"]');
    return !tab || !tab.classList.contains('hide');
  });
  const anyClosed=ids.some(id=>!document.getElementById(id).classList.contains('open'));
  document.getElementById('navAllBtn').textContent=anyClosed?'全開':'全閉';
}
function toggleAll(){
  const ids=['paneRaw','block1','block2','paneGen','block4'].filter(id=>{
    const tab=document.querySelector('.navtab[data-target="'+id+'"]');
    return !tab || !tab.classList.contains('hide');
  });
  const anyClosed=ids.some(id=>!document.getElementById(id).classList.contains('open'));
  ids.forEach(id=>document.getElementById(id).classList.toggle('open',anyClosed));
  document.body.classList.toggle('rawOpen',document.getElementById('paneRaw').classList.contains('open'));
  updateNavActive();
}

// ===== ヘッダー折りたたみ =====
function hideHead(){
  document.getElementById('caseHead').classList.add('collapsed');
  document.querySelector('.headShowBtn').style.display='block';
}
function showHead(){
  document.getElementById('caseHead').classList.remove('collapsed');
  document.querySelector('.headShowBtn').style.display='none';
}

// ===== 向け先 =====
function pickTarget(t){
  TARGET=t;
  document.querySelectorAll('.targetPick .tp').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  renderGen();
}

// ===== 変更検知 =====
function onRawChange(){DIRTY=true;updateSaveState();}
function onDetailChange(){
  DIRTY=true;updateSaveState();
  document.getElementById('hName').textContent=document.getElementById('dName').value||'(無題)';
  renderGen();
}
function updateSaveState(){
  const st=document.getElementById('hSt');
  const btn=document.getElementById('saveBtn');
  if(DIRTY){st.textContent='未保存の変更あり';st.className='st dirty';btn.classList.add('dirty');}
  else{st.textContent='保存済み';st.className='st saved';btn.classList.remove('dirty');}
}

// ===== ③LINE文プレビュー（ローカル簡易生成。保存後は本番テンプレの結果に差し替わる） =====
function renderGen(){
  const name=document.getElementById('dName').value||'';
  const place=document.getElementById('dPlace').value||'';
  const dates=SEL_DATES.map(fmtDateJP).join('、');
  const ts=document.getElementById('dTimeStart').value||'';
  const te=document.getElementById('dTimeEnd').value||'';
  const people=document.getElementById('dPeople').value||'〇名';
  const wear=document.getElementById('dWear').value||'';
  const job=document.getElementById('dJob').value||'';
  const priceMap={self:'p_self_bill',zero:'p_zero_bill',han:'p_han_bill',other:'p_other_bill'};
  const price=document.getElementById(priceMap[TARGET])?.value||'';
  const priceStr=price?`${Number(price).toLocaleString()}円/日`:'○○,○○○円/日';
  let irrStr='';
  if(IRR.length){
    irrStr='\n'+IRR.map(r=>`※${fmtDateJP(r.date)}のみ ${r.start}〜${r.end}`).join('\n');
  }
  let extraStr='';
  if(document.getElementById('exFood').checked){
    const a=document.getElementById('exFoodAmt').value||'0';
    extraStr+=`\n＋食費${Number(a).toLocaleString()}円/日`;
  }
  if(document.getElementById('exTrans').checked){
    const a=document.getElementById('exTransAmt').value||'0';
    extraStr+=`\n＋交通費${Number(a).toLocaleString()}円/日`;
  }
  const txt=
`✅【${name}】
□日程：${dates||'—'}
□時間：${ts&&te?ts+'〜'+te:'—'}${irrStr}
□場所：${place}
□ご依頼人数：${people}
□衣装：${wear}
□内容：${job}
□金額：${priceStr}${extraStr}`;
  document.getElementById('genPreview').textContent=txt;
}

// ===== 保存 =====
function save(){
  const btn=document.getElementById('saveBtn');

  if(MODE==='create'){
    const mention=document.getElementById('dClient').value;
    const caseName=document.getElementById('dName').value.trim();
    if(!mention){alert('送り先クライアントを選んでください');return;}
    if(!caseName){alert('案件名を入力してください');return;}
    if(!SEL_DATES.length){alert('日程を選択してください');return;}

    const priceMap={self:'p_self_bill',zero:'p_zero_bill',han:'p_han_bill',other:'p_other_bill'};
    const price=document.getElementById(priceMap[TARGET])?.value||'';
    const people=document.getElementById('dPeople').value.trim();

    const form={
      mention:mention,
      caseName:caseName,
      area:document.getElementById('dPlace').value,
      dates:SEL_DATES,
      timeStart:document.getElementById('dTimeStart').value,
      timeEnd:document.getElementById('dTimeEnd').value,
      wear:(document.getElementById('dWear').value||'').split(/[\n、,]/).map(s=>s.trim()).filter(Boolean),
      jobs:(document.getElementById('dJob').value||'').split(/\n/).map(s=>s.trim()).filter(Boolean),
      price:price,
      conditions:people?[people]:[],
      notes:'',
    };

    btn.disabled=true;btn.textContent='保存中...';
    postGAS({action:'createCase',form:form}).then(d=>{
      btn.disabled=false;btn.textContent='保存';
      if(d.ok){
        MODE='edit';
        CUR_SSID=d.result.ssId;
        CUR_TAB=d.result.tabName;
        CUR_ID=CUR_SSID+'::'+CUR_TAB;
        document.getElementById('genPreview').textContent=d.result.lineText||'';
        document.getElementById('genNote').textContent='※この文章が確定版です。コピーしてスタッフに送ってください。';
        document.getElementById('genNote').style.display='block';
        DIRTY=false;updateSaveState();
        applyModeVisibility();
        alert('案件タブを作成しました。③LINE文タブの文章をコピーして送ってください。');
      }else{
        alert('作成に失敗しました: '+(d.error||'不明なエラー'));
      }
    }).catch(e=>{
      btn.disabled=false;btn.textContent='保存';
      alert('通信エラー: '+e);
    });
    return;
  }

  // ===== 編集モード（既存案件） =====
  const meta={
    caseName:document.getElementById('dName').value.trim(),
    area:document.getElementById('dPlace').value.trim(),
    dates:SEL_DATES.slice(),               // 変更した時だけ中身が入る
    timeStart:document.getElementById('dTimeStart').value,
    timeEnd:document.getElementById('dTimeEnd').value,
  };
  const rawAdd=(document.getElementById('rawText').value||'').trim();

  // ★slotsキーは意図的に含めない＝GAS側でアサインデータには一切触らせない
  const payload={settings:{meta:meta}};
  if(rawAdd) payload.rawAdd=rawAdd;

  btn.disabled=true;btn.textContent='保存中...';
  postGAS({action:'saveCase',ssId:CUR_SSID,tabName:CUR_TAB,payload:payload}).then(d=>{
    btn.disabled=false;btn.textContent='保存';
    if(d.ok){
      if(meta.caseName){CUR.settings.caseName=meta.caseName;document.getElementById('hName').textContent=meta.caseName;}
      if(meta.area)CUR.settings.area=meta.area;
      if(rawAdd){
        CUR.rawText=(CUR.rawText?CUR.rawText+'\n\n':'')+rawAdd;
        document.getElementById('rawHistory').textContent=CUR.rawText;
        document.getElementById('rawText').value='';
      }
      localStorage.setItem('case_'+CUR_ID,JSON.stringify(CUR));
      DIRTY=false;updateSaveState();
    }else{
      alert('保存に失敗しました: '+(d.error||'不明なエラー'));
    }
  }).catch(e=>{
    btn.disabled=false;btn.textContent='保存';
    alert('通信エラー: '+e);
  });
}

// ===== 初期化 =====
loadCaseList();
updateNavActive();
document.body.classList.remove('rawOpen'); // 初期は⓪閉じ
</script>
