<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アサイン">
<title>アサイン</title>
<style>
  :root{
    --ink:#1c1c1e; --sub:#8e8e93; --line:#e5e5ea; --line2:#d1d1d6;
    --bg:#f2f2f7; --card:#fff; --field:#f2f2f7;
    --ok:#34c759; --warn:#ff9500; --off:#f7f7f9;
    --nav-h:40px;   /* ミニナビバーの高さ */
    --sav-h:52px;   /* 下部保存バーの高さ（詰めた） */
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  input,select,textarea{ font-size:16px !important; }
  html,body{ background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    text-align:left; }
  body{ padding:12px 8px 68px; max-width:520px; margin:0 auto; }
  .hide{ display:none !important; }

  /* すべて左寄せ */
  input, textarea, select { text-align:left; }

  /* ── ヘッダー ── */
  .head{ padding:6px 4px 10px; display:flex; align-items:flex-start; gap:8px; }
  .head .back{ font-size:20px; color:var(--sub); background:none; border:none; cursor:pointer; padding:0 4px 0 0; }
  .head .ttl{ flex:1; min-width:0; }
  .head .name{ font-size:19px; font-weight:700; letter-spacing:-.01em; }
  .head .sub{ font-size:12px; color:var(--sub); margin-top:2px; }
  .head .newBtn{ flex:0 0 auto; font-size:13px; font-weight:600; font-family:inherit;
    border:none; border-radius:8px; background:var(--ink); color:#fff;
    padding:7px 12px; cursor:pointer; }

  /* ── 案件一覧 ── */
  .caseItem{ background:var(--card); border-radius:12px; padding:12px 12px 12px 14px; margin-bottom:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:pointer; display:flex; align-items:flex-start; gap:8px; }
  .caseItem:active{ background:#f0f0f5; }
  .caseItem.pinned{ background:#fffdf5; }
  .caseItem .ci-main{ flex:1; min-width:0; }
  .caseItem .cn{ font-weight:650; font-size:15px; }
  .caseItem .cd{ font-size:12px; color:var(--sub); margin-top:3px; }
  .caseItem .cc{ font-size:11px; color:var(--sub); margin-top:5px; display:inline-block;
    background:var(--field); border-radius:5px; padding:2px 7px; }
  .caseItem .pin{ flex:0 0 30px; border:none; background:none; cursor:pointer;
    font-size:16px; opacity:.25; padding:2px; }
  .caseItem .pin.on{ opacity:1; }
  .clientChips{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 4px 10px; }
  .clientChips .chip{ font-size:12px; padding:6px 10px; background:var(--card);
    border-radius:14px; cursor:pointer; border:1px solid var(--line); }
  .clientChips .chip.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* ══════ 案件詳細のレイアウト ══════
     ⓪原文（上1/3固定）・中央スクロール領域（①②④）・③LINE文（下1/3固定）
  ══════════════════════════════════════ */
  .caseWrap{
    position:relative;
    /* 画面の残り高さを使う（ヘッダー分ざっくり60、下保存バー分52を差し引き） */
    height: calc(100vh - 60px - var(--sav-h));
    display:flex; flex-direction:column;
  }

  /* 常駐ミニナビバー */
  .navbar{ position:sticky; top:0; z-index:40; background:rgba(242,242,247,.95);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:4px 4px; height:var(--nav-h); flex:0 0 auto; }
  .navtabs{ display:flex; gap:2px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:0 2px; scrollbar-width:none; }
  .navtabs::-webkit-scrollbar{ display:none; }
  .navtab{ flex:1 1 auto; font-family:inherit; border:none; background:transparent;
    color:var(--sub); font-size:12px; padding:6px 4px; border-radius:8px;
    cursor:pointer; white-space:nowrap; }
  .navtab.active{ background:var(--ink); color:#fff; font-weight:600; }
  .navtab:not(.active):active{ background:var(--field); }

  /* ⓪原文パネル（上1/3固定・展開時のみ） */
  .paneRaw{
    background:var(--card); border-radius:12px; margin:6px 0 0;
    box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden;
    max-height:0; transition:max-height .25s ease;
    flex:0 0 auto;
  }
  .paneRaw.open{ max-height:33vh; }
  .paneRaw .inner{
    padding:10px 11px; height:33vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }

  /* 中央スクロール領域（①②④が縦に並ぶ） */
  .scrollMain{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:6px 0 6px;
  }

  /* ③LINE文パネル（下1/3固定・展開時のみ） */
  .paneGen{
    background:var(--card); border-radius:12px; margin:0 0 6px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden;
    max-height:0; transition:max-height .25s ease;
    flex:0 0 auto;
  }
  .paneGen.open{ max-height:34vh; }
  .paneGen .inner{
    padding:10px 11px; height:34vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }

  /* ①②④の中身カード */
  .block{
    background:var(--card); border-radius:12px; margin-bottom:9px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    max-height:0; overflow:hidden; transition:max-height .25s ease;
  }
  .block.open{ max-height:12000px; }
  .block .inner{ padding:12px 11px; }

  .hint{ font-size:12px; color:var(--sub); margin:10px 0 5px; }
  .hint:first-child{ margin-top:0; }

  /* ── 入力行：ラベル1行＋入力1行の2行構造 ── */
  .field{ margin-bottom:10px; }
  .field .lbl{ display:block; font-size:11px; color:var(--sub); margin-bottom:4px; }
  .field input, .field textarea, .field select{
    display:block; width:100%; border:none; background:var(--field);
    border-radius:8px; padding:9px 11px; font-family:inherit; color:var(--ink);
    text-align:left;
  }
  .field textarea{ min-height:70px; resize:vertical; line-height:1.5; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:1.5px solid var(--ink); }
  .field .unit{ color:var(--sub); font-size:12px; margin-left:6px; }
  .field .row2{ display:flex; align-items:center; gap:8px; }
  .field .row2 input{ flex:1; }

  /* ── 単価行（コンパクト2行構造） ── */
  .priceRow{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .priceRow .lbl{ flex:0 0 32px; font-size:12px; color:var(--sub); }
  .priceRow input{ flex:1; border:none; background:var(--field); border-radius:8px;
    height:36px; padding:0 11px; font-family:inherit; color:var(--ink); text-align:left; }
  .priceRow input:focus{ outline:1.5px solid var(--ink); }
  .priceRow .unit{ color:var(--sub); font-size:12px; }

  /* ── 払出単価表 ── */
  .payhead,.payrow3{ display:flex; gap:6px; align-items:center; margin-bottom:5px; }
  .payhead .pco,.payrow3 .pco{ flex:0 0 44px; color:var(--sub); font-size:12px; }
  .payhead .pcol{ flex:1; text-align:left; font-size:11px; color:var(--sub); padding-left:6px; }
  .payrow3 .paycell{ flex:1; min-width:0; border:none; background:var(--field); border-radius:8px;
    height:34px; padding:0 8px; font-family:inherit; text-align:left; color:var(--ink); }
  .payrow3 .paycell:focus{ outline:1.5px solid var(--ink); }

  /* ── 生成LINE文 ── */
  .targetPick{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
  .targetPick .tp{ font-family:inherit; border:none; background:var(--field);
    color:var(--sub); font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .targetPick .tp.on{ background:var(--ink); color:#fff; font-weight:600; }

  .genOut{ font-family:inherit; font-size:13px; line-height:1.7; white-space:pre-wrap;
    color:#1c1c1e; background:var(--field); border-radius:8px; padding:10px; text-align:left; }

  .extras{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .extra{ display:inline-flex; align-items:center; gap:5px; background:var(--field);
    border-radius:8px; padding:5px 9px; cursor:pointer; font-size:12px; }
  .extra input[type=checkbox]{ width:14px; height:14px; margin:0; accent-color:var(--ink); }
  .extra input[type=number]{ width:52px; text-align:left; border:none;
    background:var(--card); border-radius:5px; padding:2px 6px; height:22px; }

  .copyBar{ display:flex; gap:8px; margin-top:8px; }
  .copyBar button{ flex:1; border:none; border-radius:10px; font-size:13px;
    font-weight:600; font-family:inherit; padding:9px; cursor:pointer; }
  .btnCopy{ background:var(--ink); color:#fff; }
  .btnCopy.done{ background:var(--ok); color:#fff; }

  /* ══════ 盤面 ══════ */
  .boardWrap{ overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--card); border-radius:8px; }
  .board{ border-collapse:collapse; font-size:13px; }
  .board th, .board td{ border:1px solid var(--line2); padding:0;
    text-align:left; white-space:nowrap; }
  .board .cLabel{ position:sticky; left:0; z-index:2; background:var(--card);
    text-align:left; font-weight:600; padding:9px 9px; min-width:110px;
    border-right:1.5px solid var(--line2); font-size:12px; }
  .board thead .cLabel{ background:#efeff2; }
  .board thead th{ background:#efeff2; font-weight:600; padding:8px 12px; font-size:12px; min-width:88px; text-align:left; }
  .board .trTime td, .board .trTime th{ background:#f7f7f9; font-size:11px;
    color:var(--sub); font-weight:600; padding:5px 8px; text-align:left; }
  .board td.cell{ padding:0; min-width:88px; }
  .board td.cell .cellIn{ display:block; width:100%; min-height:38px;
    padding:9px 8px; cursor:pointer; font-size:13px; text-align:left; }
  .board td.cell:active .cellIn{ background:#e8e8ed; }
  .board td.cell.off .cellIn{ background:var(--off); }
  .board td.cell.conly .cellIn{ color:var(--sub); font-size:12px; }
  .board .cCo{ border:none !important; text-align:left; padding:8px 8px;
    color:var(--ink); font-size:11px; background:var(--bg); }
  .board tr.sep td{ border:none; height:10px; background:var(--bg); }
  .board tr.addRow td.addCell{ border:1px dashed var(--line2); background:#fbfbfc; }
  .board tr.addRow .addBtn{ display:block; width:100%; padding:9px;
    background:none; border:none; color:var(--sub); font-size:12px;
    font-family:inherit; cursor:pointer; text-align:left; padding-left:10px; }
  .board tr.addRow .addBtn:active{ background:var(--field); }

  .addgrp{ display:flex; gap:7px; align-items:center; margin-top:10px; }
  .addgrp select{ flex:1; border:none; background:var(--field); border-radius:8px;
    height:36px; font-family:inherit; padding:0 10px; text-align:left; }
  .addgrp .btnAdd{ border:none; border-radius:8px; background:var(--ink); color:#fff;
    font-size:13px; font-weight:600; font-family:inherit; padding:9px 14px; cursor:pointer; }

  /* ═══ ポップアップ ═══ */
  .modalBg{ position:fixed; inset:0; background:rgba(0,0,0,.35);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .18s; }
  .modalBg.on{ opacity:1; pointer-events:auto; }
  .modal{ background:var(--card); width:100%; max-width:520px;
    border-radius:16px 16px 0 0; padding:16px 14px 22px;
    transform:translateY(24px); transition:transform .2s; text-align:left; }
  .modalBg.on .modal{ transform:translateY(0); }
  .modal h3{ font-size:15px; font-weight:700; margin-bottom:12px; text-align:left; }
  .modal h3 .mSub{ color:var(--sub); font-weight:400; font-size:12px; margin-left:6px; }
  .mField{ margin-bottom:8px; }
  .mField .mLbl{ display:block; font-size:11px; color:var(--sub); margin-bottom:3px; }
  .mField input, .mField select{ display:block; width:100%; border:none; background:var(--field);
    border-radius:8px; height:40px; padding:0 11px; font-family:inherit; color:var(--ink); text-align:left; }
  .mField input:focus, .mField select:focus{ outline:1.5px solid var(--ink); }
  .mDaysLbl{ font-size:11px; color:var(--sub); margin:10px 0 5px; }
  .mDays{ display:flex; flex-wrap:wrap; gap:5px; }
  .mDay{ display:inline-flex; align-items:center; gap:5px; font-size:12px;
    color:var(--ink); background:var(--field); border-radius:8px; padding:7px 10px; cursor:pointer; }
  .mDay input{ width:15px; height:15px; margin:0; accent-color:var(--ink); }
  .mDay input:not(:checked) + span{ opacity:.35; text-decoration:line-through; }
  .mPay{ font-size:12px; color:var(--sub); margin:10px 0 12px;
    background:var(--field); border-radius:8px; padding:8px 11px; }
  .mPay b{ color:var(--ink); font-variant-numeric:tabular-nums; font-size:14px; }
  .mBtns{ display:flex; gap:8px; }
  .mBtns button{ border:none; border-radius:10px; font-size:14px; font-weight:600;
    font-family:inherit; padding:11px; cursor:pointer; }
  .mBtns .mDel{ flex:0 0 auto; background:var(--field); color:#ff3b30; padding:11px 18px; }
  .mBtns .mOk{ flex:1; background:var(--ink); color:#fff; }

  /* ── 原文 ── */
  #rawText{ font-family:inherit; font-size:13px; line-height:1.7; white-space:pre-wrap;
    color:#3a3a3c; text-align:left; }
  .rawnote{ display:flex; gap:6px; align-items:flex-start; margin-top:8px; }
  .rawadd{ flex:1; font-family:inherit; border:none; background:var(--field);
    border-radius:8px; padding:9px; resize:vertical; color:var(--ink); text-align:left; }
  .rawnote .del{ flex:0 0 20px; border:none; background:none; color:#c7c7cc;
    font-size:16px; cursor:pointer; padding-top:8px; }
  .btn{ font-size:12px; font-family:inherit; border:none; border-radius:8px;
    background:var(--field); color:#3a3a3c; cursor:pointer; padding:6px 11px; }

  /* ── 保存バー（幅・高さを詰めた） ── */
  .savebar{ position:fixed; left:0; right:0; bottom:0; padding:6px 10px 10px;
    background:rgba(242,242,247,.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); z-index:50; height:var(--sav-h); }
  .savebar .inner{ max-width:520px; margin:0 auto; display:flex; align-items:center; gap:8px; height:100%; }
  .savebar .status{ flex:1; font-size:11px; color:var(--sub); text-align:left; }
  .savebar .status.dirty{ color:var(--warn); font-weight:600; }
  .savebar .status.saved{ color:var(--ok); }
  .savebar .save{ border:none; border-radius:8px; background:var(--ink); color:#fff;
    font-size:13px; font-weight:600; font-family:inherit; padding:7px 18px; cursor:pointer; }
  .savebar .save:disabled{ opacity:.4; }

  /* ── 新規作成モード ── */
  .card{ background:var(--card); border-radius:12px; padding:12px 12px;
    margin-bottom:9px; box-shadow:0 1px 2px rgba(0,0,0,.04); text-align:left; }
  .card h3{ font-size:12px; font-weight:600; color:var(--sub); margin-bottom:8px; }
  .items{ display:flex; flex-direction:column; gap:6px; }
  .item{ display:flex; align-items:center; gap:6px; }
  .item input{ flex:1; min-width:0; border:none; background:var(--field);
    border-radius:8px; height:36px; padding:0 11px; font-family:inherit; color:var(--ink); text-align:left; }
  .item input:focus{ outline:1.5px solid var(--ink); }
  .item .del{ flex:0 0 24px; height:36px; border:none; background:none;
    color:#c7c7cc; font-size:15px; cursor:pointer; }
  .addItem{ align-self:flex-start; border:none; background:var(--field); color:#3a3a3c;
    border-radius:8px; font-size:12px; font-family:inherit; padding:6px 11px; cursor:pointer; margin-top:2px; }
  .dates{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .dchip{ display:inline-flex; align-items:center; gap:5px; background:var(--field);
    border-radius:8px; padding:6px 9px; font-size:12px; }
  .dchip button{ border:none; background:none; color:#c7c7cc; font-size:14px; cursor:pointer; padding:0; }
  .dateAdd{ display:flex; gap:7px; }
  .dateAdd input{ flex:1; border:none; background:var(--field); border-radius:8px;
    height:38px; padding:0 11px; font-family:inherit; text-align:left; }
  .dateAdd button{ border:none; background:var(--ink); color:#fff; border-radius:8px;
    font-size:12px; font-weight:600; font-family:inherit; padding:0 14px; cursor:pointer; }
  .preview{ background:#1c1c1e; color:#e8e8ed; border-radius:10px;
    padding:11px; font-size:12px; line-height:1.7; white-space:pre-wrap;
    word-break:break-word; margin-bottom:8px; min-height:60px; text-align:left; }

  .loading{ text-align:left; padding:32px 8px; color:var(--sub); }
  .err{ background:#ffe5e5; color:#c00; border-radius:8px; padding:9px 10px; margin-bottom:9px; font-size:12px; text-align:left; }
</style>
</head>
<body>

<!-- ═══ 画面1：案件一覧 ═══ -->
<div id="viewList">
  <div class="head">
    <div class="ttl">
      <div class="name">案件を選ぶ</div>
      <div class="sub" id="listSub">読み込み中…</div>
    </div>
    <button class="newBtn" onclick="openNew()">＋ 新規</button>
  </div>
  <div class="clientChips" id="clientChips"></div>
  <div id="caseList"><div class="loading">読み込み中…</div></div>
</div>

<!-- ═══ 画面2：案件 ═══ -->
<div id="viewCase" class="hide">
  <div class="head">
    <button class="back" onclick="backToList()">‹</button>
    <div class="ttl">
      <div class="name" id="hName">—</div>
      <div class="sub" id="hSub">—</div>
    </div>
  </div>

  <div class="caseWrap">

    <!-- 常駐ミニナビバー -->
    <div class="navbar">
      <div class="navtabs" id="navtabs">
        <button class="navtab" data-target="paneRaw">⓪ 原文</button>
        <button class="navtab active" data-target="block1">① 詳細</button>
        <button class="navtab" data-target="block2">② 単価</button>
        <button class="navtab" data-target="paneGen">③ LINE文</button>
        <button class="navtab" data-target="block4">④ アサイン</button>
      </div>
    </div>

    <!-- ⓪原文（開いてる時は上1/3固定） -->
    <div class="paneRaw" id="paneRaw">
      <div class="inner">
        <div id="rawText">—</div>
        <div id="rawNotes"></div>
        <button class="btn" onclick="addRawNote()" style="margin-top:8px;">＋ 追加文章</button>
      </div>
    </div>

    <!-- 中央スクロール領域：①②④ -->
    <div class="scrollMain" id="scrollMain">

      <div id="errBox"></div>

      <!-- ① 案件詳細 -->
      <div class="block open" id="block1">
        <div class="inner">
          <div class="field">
            <span class="lbl">案件名</span>
            <input id="dName" oninput="onDetailChange()">
          </div>
          <div class="field">
            <span class="lbl">場所</span>
            <input id="dArea" oninput="onDetailChange()">
          </div>
          <div class="field">
            <span class="lbl">日程</span>
            <input id="dDates" readonly>
          </div>
          <div class="field">
            <span class="lbl">時間</span>
            <input id="dTime" readonly>
          </div>
          <div class="field">
            <span class="lbl">お仕事内容（改行区切り）</span>
            <textarea id="dJobs" oninput="onDetailChange()"></textarea>
          </div>
        </div>
      </div>

      <!-- ② 単価設定 -->
      <div class="block" id="block2">
        <div class="inner">
          <div class="hint">請求単価（クライアントへ）</div>
          <div class="priceRow"><span class="lbl">D</span><input id="billD" type="text" inputmode="numeric" oninput="fmtMoney(this); refreshGen();" onfocus="this.select()"><span class="unit">円</span></div>
          <div class="priceRow"><span class="lbl">AD</span><input id="billAD" type="text" inputmode="numeric" oninput="fmtMoney(this); refreshGen();" onfocus="this.select()"><span class="unit">円</span></div>
          <div class="priceRow"><span class="lbl">ST</span><input id="billST" type="text" inputmode="numeric" oninput="fmtMoney(this); refreshGen();" onfocus="this.select()"><span class="unit">円</span></div>
          <div class="hint">払出単価（会社ごと）</div>
          <div id="payTable"></div>
          <div class="hint" style="margin-top:8px;">※ ten / next は「その他」の単価が適用されます</div>
        </div>
      </div>

      <!-- ④ アサイン編集 -->
      <div class="block" id="block4">
        <div class="inner">
          <div class="boardWrap"><table class="board" id="board"></table></div>
          <div class="addgrp">
            <select id="newGrp"><option value="">大項目を追加…</option></select>
            <button class="btnAdd" onclick="addGroup()">追加</button>
          </div>
        </div>
      </div>

    </div><!-- /scrollMain -->

<script>
/* ════ 設定 ════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzX7Pzhq2TFFOHCr0saeHG7qeWA5PuBptUe4-kAtzj-kYWIkJE7z7F1vkvkAMEUzQpPcA/exec';
let COMPANIES = ['自社','ZERO','ten','next','ハン','その他'];
const PAY_COMPANIES = ['自社','ZERO','ハン','その他'];
const ROLES = ['D','AD','ST'];
let POS_OPTIONS = ['クローク','受付','ドリンク補充','誘導'];
let CLIENTS = [];

/* ════ 状態 ════ */
let CASES = [], CURRENT = null, DATA = null;
let CLIENT_FILTER = new Set();
let DIRTY = false, SAVING = false, autoTimer = null;
let DATES = [];
let SLOTS = [];
let editingId = null;
let currentTarget = '自社';
let currentBlock = 'block1';   // 中央スクロール領域で今アクティブなブロック

/* ════ GAS通信 ════ */
async function callGas(payload){
  const res = await fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain'}, redirect:'follow',
    body: JSON.stringify(payload),
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '不明なエラー');
  return json;
}

/* ════ 一覧 ════ */
const PIN_KEY='haruki_pins', LIST_CACHE='haruki_list', FILTER_KEY='haruki_filter';
function getPins(){ try{ return JSON.parse(localStorage.getItem(PIN_KEY)||'[]'); }catch(e){ return []; } }
function setPins(a){ try{ localStorage.setItem(PIN_KEY, JSON.stringify(a)); }catch(e){} }
function ckey(c){ return c.ssId+'::'+c.tabName; }
function togglePin(i,ev){
  ev.stopPropagation();
  const k=ckey(CASES[i]), p=getPins(), at=p.indexOf(k);
  if(at>=0) p.splice(at,1); else p.push(k);
  setPins(p); renderCaseList();
}
function dsort(d){
  const m=String(d||'').match(/(\d{1,2})\/(\d{1,2})/);
  return m ? Number(m[1])*100+Number(m[2]) : 0;
}
function loadFilter(){
  try{ const a = JSON.parse(localStorage.getItem(FILTER_KEY)||'[]'); CLIENT_FILTER = new Set(a); }catch(e){}
}
function saveFilter(){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify(Array.from(CLIENT_FILTER))); }catch(e){}
}

async function loadCaseList(){
  loadFilter();
  try{
    const c = localStorage.getItem(LIST_CACHE);
    if(c){ CASES = JSON.parse(c); renderClientChips(); renderCaseList(); }
  }catch(e){}
  try{
    const r = await callGas({ action:'getCaseList' });
    CASES = r.cases || [];
    try{ localStorage.setItem(LIST_CACHE, JSON.stringify(CASES)); }catch(e){}
    renderClientChips(); renderCaseList();
  }catch(e){
    if(CASES.length===0){
      document.getElementById('caseList').innerHTML='<div class="err">読み込みに失敗しました<br>'+esc(e.message)+'</div>';
      document.getElementById('listSub').textContent='エラー';
    }
  }
}

function renderClientChips(){
  const uniq = Array.from(new Set(CASES.map(c=>c.client))).sort();
  document.getElementById('clientChips').innerHTML =
    uniq.map(c=>'<span class="chip'+(CLIENT_FILTER.has(c)?' on':'')+'" onclick="toggleClientFilter(\''+escAttr(c)+'\')">'+esc(c)+'</span>').join('');
}
function toggleClientFilter(c){
  if(CLIENT_FILTER.has(c)) CLIENT_FILTER.delete(c);
  else CLIENT_FILTER.add(c);
  saveFilter(); renderClientChips(); renderCaseList();
}

function renderCaseList(){
  const wrap = document.getElementById('caseList');
  const pins = getPins();
  let items = CASES.map((c,i)=>({ c, i, p: pins.indexOf(ckey(c))>=0 }));
  if(CLIENT_FILTER.size>0) items = items.filter(o=>CLIENT_FILTER.has(o.c.client));
  items.sort((a,b)=> a.p!==b.p ? (a.p?-1:1) : dsort(b.c.dates)-dsort(a.c.dates));

  document.getElementById('listSub').textContent = items.length+'件'+(CLIENT_FILTER.size>0?'（絞込中）':'');
  if(items.length===0){ wrap.innerHTML='<div class="loading">案件がありません</div>'; return; }
  wrap.innerHTML = items.map(o=>
    '<div class="caseItem'+(o.p?' pinned':'')+'" onclick="openCase('+o.i+')">'+
      '<div class="ci-main">'+
        '<div class="cn">'+esc(o.c.caseName)+'</div>'+
        '<div class="cd">'+esc(o.c.dates)+(o.c.area?' ／ '+esc(o.c.area):'')+'</div>'+
        '<div class="cc">'+esc(o.c.client)+'</div>'+
      '</div>'+
      '<button class="pin'+(o.p?' on':'')+'" onclick="togglePin('+o.i+',event)">'+(o.p?'📌':'📍')+'</button>'+
    '</div>').join('');
}

/* ════ 案件を開く ════ */
async function openCase(i){
  CURRENT = CASES[i];
  show('viewCase');
  document.getElementById('hName').textContent = CURRENT.caseName;
  document.getElementById('hSub').textContent  = CURRENT.dates+' ／ '+CURRENT.time;
  document.getElementById('errBox').innerHTML = '';
  // 初期：⓪閉じ、①開き、②閉じ、③閉じ、④閉じ
  document.getElementById('paneRaw').classList.remove('open');
  document.getElementById('paneGen').classList.remove('open');
  document.getElementById('block1').classList.add('open');
  document.getElementById('block2').classList.remove('open');
  document.getElementById('block4').classList.remove('open');
  currentBlock = 'block1';
  setActiveNav('block1');
  setStatus('読み込み中…');
  try{
    const r = await callGas({ action:'getCase', ssId:CURRENT.ssId, tabName:CURRENT.tabName });
    DATA = r.data;
    buildAll();
    DIRTY=false; setStatus('保存済み','saved');
  }catch(e){
    document.getElementById('errBox').innerHTML='<div class="err">読み込みに失敗しました<br>'+esc(e.message)+'</div>';
    setStatus('エラー');
  }
}
function backToList(){
  if(DIRTY && !confirm('未保存の変更があります。破棄して戻りますか？')) return;
  clearAuto(); DIRTY=false; show('viewList');
}

/* ════ ミニナビ切替 ════ */
document.getElementById('navtabs').addEventListener('click', ev=>{
  const btn = ev.target.closest('.navtab');
  if(!btn) return;
  const id = btn.dataset.target;
  navigateTo(id);
});

function navigateTo(id){
  if(id==='paneRaw'){
    // 上パネル：トグル
    const el = document.getElementById('paneRaw');
    el.classList.toggle('open');
  } else if(id==='paneGen'){
    // 下パネル：トグル
    const el = document.getElementById('paneGen');
    el.classList.toggle('open');
  } else {
    // 中央（①②④）：他を閉じ、対象を開いてスクロール
    ['block1','block2','block4'].forEach(b=>{
      document.getElementById(b).classList.toggle('open', b===id);
    });
    currentBlock = id;
    setTimeout(()=>{
      const sm = document.getElementById('scrollMain');
      const el = document.getElementById(id);
      sm.scrollTo({ top: el.offsetTop - 4, behavior:'smooth' });
    }, 30);
  }
  setActiveNav(id);
}

function setActiveNav(id){
  document.querySelectorAll('.navtab').forEach(b=>{
    b.classList.toggle('active', b.dataset.target===id);
  });
}

/* ════ 詳細 → 状態 ════ */
function buildAll(){
  const s = DATA.settings;

  if(DATA.masters){
    if(DATA.masters.positions && DATA.masters.positions.length) POS_OPTIONS = DATA.masters.positions;
    if(DATA.masters.companies && DATA.masters.companies.length) COMPANIES  = DATA.masters.companies;
  }

  document.getElementById('dName').value  = s.caseName || '';
  document.getElementById('dArea').value  = s.area || '';
  document.getElementById('dDates').value = s.dates || '';
  document.getElementById('dTime').value  = s.time || '';

  const jobs = [];
  (DATA.slots||[]).forEach(x=>{ if(x.pos && jobs.indexOf(x.pos)<0) jobs.push(x.pos); });
  document.getElementById('dJobs').value = jobs.join('\n');

  document.getElementById('billD').value  = comma(s.bill.D);
  document.getElementById('billAD').value = comma(s.bill.AD);
  document.getElementById('billST').value = comma(s.bill.ST);

  let h = '<div class="payhead"><span class="pco"></span>'+
          ROLES.map(r=>'<span class="pcol">'+r+'</span>').join('')+'</div>';
  PAY_COMPANIES.forEach(co=>{
    h += '<div class="payrow3"><span class="pco">'+esc(co)+'</span>';
    ROLES.forEach(role=>{
      const v = (s.pay[co] && s.pay[co][role]) ? s.pay[co][role] : '';
      h += '<input class="paycell" type="text" inputmode="numeric" data-co="'+esc(co)+'" data-role="'+role+'" '+
           'value="'+comma(v)+'" placeholder="¥" oninput="fmtMoney(this); renderBoard(); updateModalPay(); refreshGen();" onfocus="this.select()">';
    });
    h += '</div>';
  });
  document.getElementById('payTable').innerHTML = h;

  const tp = document.getElementById('targetPick');
  tp.innerHTML = PAY_COMPANIES.map(co=>
    '<button class="tp'+(co===currentTarget?' on':'')+'" onclick="pickTarget(\''+escAttr(co)+'\')">'+esc(co)+'</button>'
  ).join('');

  document.getElementById('exFood').checked = false;
  document.getElementById('exTrans').checked = false;

  refreshGen();

  DATES = [];
  (DATA.slots||[]).forEach(x=>{ if(x.date && DATES.indexOf(x.date)<0) DATES.push(x.date); });

  const map = {}; SLOTS = []; let uid = 0;
  (DATA.slots||[]).forEach(x=>{
    const k = x.pos+'|'+x.role+'|'+x.name+'|'+x.company;
    if(!map[k]){
      map[k] = { id:'s'+(uid++), pos:x.pos, role:x.role||'ST',
                 name:x.name||'', company:x.company||'自社',
                 start:x.start||'', end:x.end||'', days:[] };
      SLOTS.push(map[k]);
    }
    if(x.date && map[k].days.indexOf(x.date)<0) map[k].days.push(x.date);
  });

  document.getElementById('newGrp').innerHTML =
    '<option value="">大項目を追加…</option>' + POS_OPTIONS.map(p=>'<option>'+esc(p)+'</option>').join('');

  document.getElementById('rawText').textContent = DATA.rawText || '（原文なし）';
  document.getElementById('rawNotes').innerHTML = '';

  renderBoard();
}

function onDetailChange(){ refreshGen(); markDirty(); }

/* ════ ③LINE文（金額は自動抽出のみ・手修正なし） ════ */
function pickTarget(co){
  currentTarget = co;
  document.querySelectorAll('#targetPick .tp').forEach(b=>{
    b.classList.toggle('on', b.textContent===co);
  });
  refreshGen();
}

function getPayFromTable(co, role){
  const cell = document.querySelector('.paycell[data-co="'+co+'"][data-role="'+role+'"]');
  return cell ? uncomma(cell.value) : '';
}

function refreshGen(){ renderGen(); }

function renderGen(){
  // 単価の自動決定：自社=請求単価、他=払出単価
  const priceD  = (currentTarget==='自社')
      ? uncomma(document.getElementById('billD').value)
      : getPayFromTable(currentTarget, 'D');
  const priceST = (currentTarget==='自社')
      ? uncomma(document.getElementById('billST').value)
      : getPayFromTable(currentTarget, 'ST');

  const L = [];
  const name = document.getElementById('dName').value.trim();
  L.push('✅【' + (name||'（案件名）') + '】');

  L.push('');
  L.push('□日程');
  L.push(document.getElementById('dDates').value || '');

  L.push('');
  L.push('□時間');
  L.push(document.getElementById('dTime').value || '');

  const area = document.getElementById('dArea').value.trim();
  if(area){ L.push(''); L.push('□場所'); L.push(area); }

  if(priceD || priceST){
    L.push(''); L.push('□金額');
    if(priceD)  L.push('D' + Number(priceD).toLocaleString() + '円/日');
    if(priceST) L.push('ST' + Number(priceST).toLocaleString() + '円/日');
    if(document.getElementById('exFood').checked){
      const a = Number(document.getElementById('exFoodAmt').value)||0;
      L.push('＋食費' + a.toLocaleString() + '円/日');
    }
    if(document.getElementById('exTrans').checked){
      const a = Number(document.getElementById('exTransAmt').value)||0;
      L.push('＋交通費' + a.toLocaleString() + '円/日');
    }
  }

  const jobs = document.getElementById('dJobs').value.split(/\n+/).map(x=>x.trim()).filter(x=>x);
  if(jobs.length){
    L.push(''); L.push('□お仕事内容');
    jobs.forEach((j,i)=> L.push(j + (i===jobs.length-1 ? 'など！' : '')));
  }

  document.getElementById('genOut').textContent = L.join('\n').trim();
}

async function copyGen(){
  const btn = document.getElementById('btnCopy');
  const txt = document.getElementById('genOut').textContent;
  try{
    await navigator.clipboard.writeText(txt);
    btn.classList.add('done'); btn.textContent='✓ コピーしました';
    setTimeout(()=>{ btn.classList.remove('done'); btn.textContent='📋 コピー'; }, 2000);
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    btn.textContent='✓ コピーしました';
    setTimeout(()=>{ btn.textContent='📋 コピー'; },2000);
  }
}

/* ════ ④盤面 ════ */
function renderBoard(){
  const t = document.getElementById('board');
  const nCol = 1 + DATES.length;

  const byPos = {}, posOrder = [];
  SLOTS.forEach(s=>{
    if(!byPos[s.pos]){ byPos[s.pos]=[]; posOrder.push(s.pos); }
    byPos[s.pos].push(s);
  });
  const rank = r => r==='D'?0 : r==='AD'?1 : 2;
  posOrder.forEach(p=>{
    byPos[p].sort((a,b)=> rank(a.role)-rank(b.role));
    let st = 0;
    byPos[p].forEach(s=>{
      if(s.role==='ST'){ st++; s.label = p+'ST'+st; }
      else s.label = p + s.role;
    });
  });

  const timeStr = (DATA && DATA.settings && DATA.settings.time ? DATA.settings.time : '').replace('〜','-');

  let html = '<thead>';
  html += '<tr><th class="cLabel">日程</th>' +
          DATES.map(d=>'<th>'+esc(d)+'</th>').join('') +
          '<th class="cCo"></th></tr>';
  html += '<tr class="trTime"><th class="cLabel">時間</th>' +
          DATES.map(()=>'<td>'+esc(timeStr)+'</td>').join('') +
          '<td class="cCo"></td></tr></thead><tbody>';

  posOrder.forEach((pos, pi)=>{
    if(pi>0) html += '<tr class="sep"><td colspan="'+(nCol+1)+'"></td></tr>';

    byPos[pos].forEach(s=>{
      html += '<tr>';
      html += '<th class="cLabel">'+esc(s.label)+'</th>';
      DATES.forEach(d=>{
        const on = s.days.indexOf(d)>=0;
        const txt = on ? (s.name || s.company) : '';
        let cls = 'cell';
        if(!on) cls += ' off';
        else if(!s.name) cls += ' conly';
        html += '<td class="'+cls+'" onclick="openModal(\''+s.id+'\')">'+
                  '<span class="cellIn">'+esc(txt)+'</span></td>';
      });
      html += '<td class="cCo">'+esc(s.company)+'</td>';
      html += '</tr>';
    });

    html += '<tr class="addRow"><td class="addCell" colspan="'+nCol+'">'+
              '<button class="addBtn" onclick="addSlot(\''+escAttr(pos)+'\')">＋ 枠を追加</button>'+
            '</td><td class="cCo"></td></tr>';
  });

  html += '</tbody>';
  t.innerHTML = html;
}

function addSlot(pos){
  const s = { id:'s'+Date.now(), pos:pos, role:'ST', name:'', company:'自社',
              start:'', end:'', days: DATES.slice() };
  SLOTS.push(s);
  renderBoard(); markDirty();
  openModal(s.id);
}
function addGroup(){
  const sel = document.getElementById('newGrp');
  const pos = sel.value; if(!pos) return;
  sel.value = '';
  addSlot(pos);
}

function openModal(id){
  const s = SLOTS.find(x=>x.id===id); if(!s) return;
  editingId = id;
  document.getElementById('mTitle').innerHTML =
    esc(s.label||s.pos) + '<span class="mSub">'+esc(s.pos)+'</span>';
  document.getElementById('mRole').innerHTML =
    ROLES.map(r=>'<option'+(r===s.role?' selected':'')+'>'+r+'</option>').join('');
  document.getElementById('mName').value = s.name || '';
  document.getElementById('mCo').innerHTML =
    COMPANIES.map(c=>'<option'+(c===s.company?' selected':'')+'>'+esc(c)+'</option>').join('');
  document.getElementById('mDays').innerHTML = DATES.map(d=>
    '<label class="mDay"><input type="checkbox" data-date="'+escAttr(d)+'"'+
    (s.days.indexOf(d)>=0?' checked':'')+' onchange="onModalChange()"><span>'+esc(d)+'</span></label>'
  ).join('');
  updateModalPay();
  document.getElementById('modalBg').classList.add('on');
}
function onModalChange(){
  const s = SLOTS.find(x=>x.id===editingId); if(!s) return;
  s.role    = document.getElementById('mRole').value;
  s.name    = document.getElementById('mName').value.trim();
  s.company = document.getElementById('mCo').value;
  s.days    = Array.from(document.querySelectorAll('#mDays input:checked')).map(cb=>cb.dataset.date);
  updateModalPay();
  renderBoard();
  markDirty();
}
function updateModalPay(){
  const s = SLOTS.find(x=>x.id===editingId); if(!s) return;
  const payCo = (PAY_COMPANIES.indexOf(s.company)>=0) ? s.company : 'その他';
  const v = getPayFromTable(payCo, s.role);
  document.getElementById('mPay').textContent = (v!=='' && v!=null) ? '¥'+Number(v).toLocaleString() : '—';
}
function delFromModal(){
  const i = SLOTS.findIndex(x=>x.id===editingId);
  if(i>=0){ SLOTS.splice(i,1); renderBoard(); markDirty(); }
  closeModal();
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('on');
  editingId = null;
}

/* ════ ⓪原文追記 ════ */
function addRawNote(){
  const w = document.getElementById('rawNotes');
  const d = document.createElement('div');
  d.className = 'rawnote';
  d.innerHTML = '<textarea class="rawadd" rows="3" placeholder="追加メモ…" oninput="markDirty()"></textarea>'+
                '<button class="del" onclick="this.parentElement.remove(); markDirty();">×</button>';
  w.appendChild(d);
}

/* ════ 保存 ════ */
function collectPayload(){
  const bill = {
    D:  uncomma(document.getElementById('billD').value),
    AD: uncomma(document.getElementById('billAD').value),
    ST: uncomma(document.getElementById('billST').value),
  };
  const pay = {};
  PAY_COMPANIES.forEach(co=>{
    pay[co] = {};
    ROLES.forEach(role=>{
      const c = document.querySelector('.paycell[data-co="'+co+'"][data-role="'+role+'"]');
      pay[co][role] = c ? uncomma(c.value) : '';
    });
  });

  const t = (DATA.settings.time||'').split('〜');
  const ds = (t[0]||'').trim(), de = (t[1]||'').trim();

  const slots = [];
  SLOTS.forEach(s=>{
    s.days.forEach(d=>{
      slots.push({ date:d, pos:s.pos, role:s.role, name:s.name, company:s.company,
                   start:s.start||ds, end:s.end||de, note:'' });
    });
  });

  const rawAdd = Array.from(document.querySelectorAll('.rawadd'))
    .map(x=>x.value.trim()).filter(v=>v).join('\n');

  return { settings:{ bill, pay }, slots, rawAdd };
}

async function save(silent){
  if(SAVING || !CURRENT) return;
  SAVING = true;
  document.getElementById('saveBtn').disabled = true;
  setStatus('保存中…');
  try{
    await callGas({ action:'saveCase', ssId:CURRENT.ssId, tabName:CURRENT.tabName,
                    payload: collectPayload() });
    DIRTY = false;
    setStatus('保存済み','saved');
    document.getElementById('rawNotes').innerHTML = '';
  }catch(e){
    setStatus('保存失敗','dirty');
    if(!silent) alert('保存に失敗しました\n'+e.message);
  }finally{
    SAVING = false;
    document.getElementById('saveBtn').disabled = false;
  }
}
function markDirty(){ DIRTY=true; setStatus('未保存の変更あり','dirty'); scheduleAuto(); }
function scheduleAuto(){ clearAuto(); autoTimer = setTimeout(()=>{ if(DIRTY) save(true); }, 30000); }
function clearAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }
function setStatus(t,c){ const e=document.getElementById('saveStatus'); e.textContent=t; e.className='status'+(c?' '+c:''); }
window.addEventListener('beforeunload', e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

/* ════ 新規作成モード ════ */
function openNew(){
  show('viewNew');
  setNewStatus('準備中…');
  document.getElementById('fStart').innerHTML = timeOpts('09:00');
  document.getElementById('fEnd').innerHTML   = timeOpts('18:00');
  ['condItems','wearItems','jobItems'].forEach(id=>document.getElementById(id).innerHTML='');
  addItem('condItems','男女OK!');
  addItem('wearItems','黒パンツ');
  addItem('jobItems','受付');
  ['fName','fArea','fTimeNote','fPrice'].forEach(id=>document.getElementById(id).value='');
  NEW_DATES=[]; renderDatesNew();
  loadClients();
  previewNew();
}
function backFromNew(){ show('viewList'); }

let NEW_DATES = [];
async function loadClients(){
  try{
    const r = await callGas({action:'getMasters'});
    CLIENTS = r.masters.clients || [];
    document.getElementById('fMention').innerHTML =
      CLIENTS.map(c=>'<option value="'+escAttr(c.mention)+'">'+esc(c.name)+'</option>').join('');
    setNewStatus('準備完了');
  }catch(e){
    document.getElementById('newErrBox').innerHTML =
      '<div class="err">クライアント一覧の取得に失敗しました<br>'+esc(e.message)+'</div>';
    setNewStatus('エラー','err');
  }
}
function timeOpts(sel){
  let h='';
  for(let i=0;i<24;i++) for(let m=0;m<60;m+=15){
    const t = ('0'+i).slice(-2)+':'+('0'+m).slice(-2);
    h += '<option'+(t===sel?' selected':'')+'>'+t+'</option>';
  }
  return h;
}
function addDateNew(){
  const el = document.getElementById('fDate');
  const v = el.value; if(!v) return;
  if(NEW_DATES.indexOf(v)<0) NEW_DATES.push(v);
  NEW_DATES.sort();
  el.value=''; renderDatesNew(); previewNew();
}
function delDateNew(d){ NEW_DATES = NEW_DATES.filter(x=>x!==d); renderDatesNew(); previewNew(); }
function renderDatesNew(){
  document.getElementById('dateChips').innerHTML = NEW_DATES.map(d=>
    '<span class="dchip">'+shortDate(d)+'<button onclick="delDateNew(\''+d+'\')">×</button></span>'
  ).join('');
}
function shortDate(ymd){
  const p = ymd.split('-');
  const wd = ['日','月','火','水','木','金','土'][new Date(+p[0],+p[1]-1,+p[2]).getDay()];
  return Number(p[1])+'/'+Number(p[2])+'('+wd+')';
}
function addItem(wrapId, ph){
  const w = document.getElementById(wrapId);
  const d = document.createElement('div');
  d.className='item';
  d.innerHTML = '<input placeholder="'+esc(ph)+'" oninput="previewNew()">'+
                '<button class="del" onclick="this.parentElement.remove(); previewNew();">×</button>';
  w.appendChild(d);
}
function getItems(wrapId){
  return Array.from(document.querySelectorAll('#'+wrapId+' input'))
    .map(i=>i.value.trim()).filter(v=>v);
}
function previewNew(){
  const L=[];
  const conds = getItems('condItems');
  if(conds.length){ L.push('🙋🏽‍♂️💁🏼‍♀️'); conds.forEach(c=>L.push(c)); }
  const name = document.getElementById('fName').value.trim();
  L.push('✅【'+(name||'（案件名）')+'】');
  L.push('□日程'); L.push(datesForLine());
  const st = document.getElementById('fStart').value;
  const en = document.getElementById('fEnd').value;
  L.push('□時間'); L.push(st+'〜'+en);
  const tn = document.getElementById('fTimeNote').value.trim();
  if(tn) L.push('※'+tn);
  const area = document.getElementById('fArea').value.trim();
  if(area){ L.push('□場所'); L.push(area); }
  const wear = getItems('wearItems');
  if(wear.length){ L.push('□服装'); wear.forEach(w=>L.push(w)); }
  const price = uncomma(document.getElementById('fPrice').value);
  if(price){ L.push('□金額'); L.push('D'+Number(price).toLocaleString()+'円/日'); }
  const jobs = getItems('jobItems');
  if(jobs.length){
    L.push('□お仕事内容');
    jobs.forEach((j,i)=> L.push(j + (i===jobs.length-1 ? 'など！' : '')));
  }
  document.getElementById('newPreview').textContent = L.join('\n');
}
function datesForLine(){
  if(!NEW_DATES.length) return '（日程を追加）';
  const byM={};
  NEW_DATES.forEach(d=>{
    const p=d.split('-'); const m=Number(p[1]), day=Number(p[2]);
    if(!byM[m]) byM[m]=[];
    byM[m].push(day);
  });
  return Object.keys(byM).map(m=> m+'/'+byM[m].join('、')).join('　');
}
async function copyNew(){
  const btn = document.getElementById('btnCopyNew');
  const txt = document.getElementById('newPreview').textContent;
  try{
    await navigator.clipboard.writeText(txt);
    btn.classList.add('done'); btn.textContent='✓ コピーしました';
    setTimeout(()=>{ btn.classList.remove('done'); btn.textContent='📋 コピー'; }, 2000);
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    btn.textContent='✓ コピーしました';
    setTimeout(()=>{ btn.textContent='📋 コピー'; },2000);
  }
}
async function createCase(){
  const name = document.getElementById('fName').value.trim();
  const mention = document.getElementById('fMention').value;
  if(!mention){ setNewStatus('送り先を選んでください','err'); return; }
  if(!name){ setNewStatus('案件名を入れてください','err'); return; }
  if(!NEW_DATES.length){ setNewStatus('日程を追加してください','err'); return; }
  if(!getItems('jobItems').length){ setNewStatus('お仕事内容を1つ以上','err'); return; }

  const btn = document.getElementById('btnGoNew');
  btn.disabled = true;
  setNewStatus('作成中…');

  const form = {
    mention, caseName:name,
    area: document.getElementById('fArea').value.trim(),
    dates: NEW_DATES.map(d=>{ const p=d.split('-'); return Number(p[1])+'/'+Number(p[2]); }),
    timeStart: document.getElementById('fStart').value,
    timeEnd:   document.getElementById('fEnd').value,
    timeNote:  document.getElementById('fTimeNote').value.trim(),
    wear:  getItems('wearItems'),
    jobs:  getItems('jobItems'),
    price: uncomma(document.getElementById('fPrice').value),
    conditions: getItems('condItems'),
    notes: '',
  };

  try{
    const r = await callGas({ action:'createCase', form });
    setNewStatus('作成しました','ok');
    try{ localStorage.removeItem(LIST_CACHE); }catch(e){}
    await loadCaseList();
    const idx = CASES.findIndex(c=>c.ssId===r.result.ssId && c.tabName===r.result.tabName);
    if(idx>=0) openCase(idx);
    else show('viewList');
  }catch(e){
    setNewStatus('作成に失敗しました','err');
    alert('作成に失敗しました\n'+e.message);
  }finally{
    btn.disabled = false;
  }
}
function setNewStatus(t,c){
  const el = document.getElementById('newStatus');
  if(!el) return;
  el.textContent=t; el.className='status'+(c?' '+c:'');
}

/* ════ 共通 ════ */
function comma(v){ if(v===''||v==null) return ''; const n=Number(String(v).replace(/,/g,'')); return isNaN(n)?'':n.toLocaleString(); }
function fmtMoney(el){ const r=el.value.replace(/[^\d]/g,''); el.value = r ? Number(r).toLocaleString() : ''; markDirty(); }
function uncomma(v){ const s=String(v==null?'':v).replace(/,/g,'').trim(); if(s==='') return ''; const n=Number(s); return isNaN(n)?'':n; }
function show(id){ ['viewList','viewCase','viewNew'].forEach(v=>document.getElementById(v).classList.toggle('hide', v!==id)); window.scrollTo(0,0); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

loadCaseList();
</script>
