<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アサイン">
<title>アサイン</title>
<style>
  /* ===== デザインは後で差し替え可能（このstyleブロックだけ入れ替える） ===== */
  :root{
    --ink:#1c1c1e; --sub:#8e8e93; --line:#e5e5ea;
    --bg:#f2f2f7; --card:#fff; --field:#f2f2f7;
    --ok:#34c759; --warn:#ff9500;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  /* iOS入力ズーム防止：入力系は16px */
  input,select,textarea{ font-size:16px !important; }
  html,body{ background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  body{ padding:14px 12px 90px; max-width:480px; margin:0 auto; }

  .hide{ display:none !important; }

  /* ── ヘッダー ── */
  .head{ padding:6px 4px 14px; display:flex; align-items:flex-start; gap:10px; }
  .head .back{ font-size:20px; color:var(--sub); background:none; border:none;
    cursor:pointer; padding:0 4px 0 0; line-height:1.2; }
  .head .ttl{ flex:1; min-width:0; }
  .head .name{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .head .sub{ font-size:13px; color:var(--sub); margin-top:2px; }

  /* ── 案件一覧 ── */
  .caseItem{ background:var(--card); border-radius:12px; padding:13px 14px; margin-bottom:9px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:pointer; }
  .caseItem:active{ background:#f0f0f5; }
  .caseItem .cn{ font-weight:650; font-size:15px; }
  .caseItem .cd{ font-size:12px; color:var(--sub); margin-top:3px; }
  .caseItem .cc{ font-size:11px; color:var(--sub); margin-top:5px;
    display:inline-block; background:var(--field); border-radius:5px; padding:2px 7px; }

  /* ── アコーディオン ── */
  .acc{ background:var(--card); border-radius:12px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; }
  .acc>.bar{ display:flex; align-items:center; justify-content:space-between;
    padding:14px 15px; cursor:pointer; user-select:none; }
  .acc>.bar .t{ font-size:15px; font-weight:600; }
  .acc>.bar .arrow{ font-size:12px; color:#c7c7cc; transition:transform .22s; }
  .acc.open>.bar .arrow{ transform:rotate(90deg); }
  .acc>.body{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .acc.open>.body{ max-height:6000px; }
  .acc>.body .inner{ padding:0 15px 16px; }

  .hint{ font-size:12px; color:var(--sub); margin:15px 0 7px; }

  /* ── 入力行 ── */
  .row{ display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .row .lbl{ width:54px; flex-shrink:0; color:var(--sub); }
  .row input,.row select{ flex:1; min-width:0; font-family:inherit;
    border:none; background:var(--field); border-radius:8px;
    padding:8px 10px; height:36px; color:var(--ink); }
  .row input:focus,.row select:focus{ outline:1.5px solid var(--ink); }
  .row .unit{ color:var(--sub); }

  /* ── 払出単価テーブル（会社×D/AD/ST）── */
  .payhead,.payrow3{ display:flex; gap:7px; align-items:center; margin-bottom:6px; }
  .payhead .pco,.payrow3 .pco{ flex:0 0 48px; color:var(--sub); font-size:12px; }
  .payhead .pcol{ flex:1; text-align:center; font-size:12px; color:var(--sub); }
  .payrow3 .paycell{ flex:1; min-width:0; border:none; background:var(--field);
    border-radius:8px; height:36px; padding:0 8px; font-family:inherit;
    text-align:right; color:var(--ink); }
  .payrow3 .paycell:focus{ outline:1.5px solid var(--ink); }

  /* ── 大項目 ── */
  .grp{ background:var(--field); border-radius:10px; margin-bottom:9px; overflow:hidden; }
  .grp>.gbar{ display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; cursor:pointer; }
  .grp>.gbar .gname{ font-weight:600; }
  .grp>.gbar .gright{ display:flex; align-items:center; gap:8px; }
  .grp>.gbar .gcount{ font-size:12px; color:var(--sub); }
  .grp>.gbar .garrow{ font-size:11px; color:#c7c7cc; transition:transform .2s; }
  .grp.closed .garrow{ transform:rotate(-90deg); }
  .grp.closed .gbody{ display:none; }
  .grp>.gbody{ padding:4px 9px 11px; }

  /* ── アサイン枠 ── */
  .slot{ background:var(--card); border-radius:8px; padding:6px 7px; margin-bottom:7px; }
  .slotmain{ display:flex; align-items:center; gap:6px; }
  .slot .rtag{ flex:0 0 30px; font-size:11px; font-weight:700; color:var(--sub); text-align:center; }
  .slot select.role{ flex:0 0 48px; border:none; background:var(--field);
    border-radius:6px; height:32px; font-family:inherit; }
  .slot input.nm{ flex:1; min-width:0; border:none; background:var(--field);
    border-radius:6px; height:32px; padding:0 7px; font-family:inherit; color:var(--ink); }
  .slot select.co{ flex:0 0 68px; border:none; background:var(--field);
    border-radius:6px; height:32px; font-family:inherit; }
  .slot .paytag{ flex:0 0 58px; text-align:right; font-size:11px; color:var(--sub);
    font-variant-numeric:tabular-nums; }
  .slot .del{ flex:0 0 20px; height:32px; border:none; background:none;
    color:#c7c7cc; font-size:16px; cursor:pointer; }
  .slot input:focus,.slot select:focus{ outline:1.5px solid var(--ink); }

  /* 稼働日チェック（デフォルト全日ON。触らなくていい） */
  .days{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; padding-left:36px; }
  .days.hide{ display:none; }
  .day{ display:inline-flex; align-items:center; gap:3px;
    font-size:11px; color:var(--sub); background:var(--field);
    border-radius:5px; padding:3px 7px; cursor:pointer; }
  .day input{ width:13px; height:13px; margin:0; accent-color:var(--ink); }
  .day input:not(:checked) + span{ opacity:.45; text-decoration:line-through; }

  /* ── ボタン ── */
  .addbar{ display:flex; gap:6px; margin-top:7px; padding:0 2px; }
  .btn{ font-size:13px; font-family:inherit; border:none; border-radius:8px;
    background:var(--card); color:#3a3a3c; cursor:pointer; padding:7px 12px; }
  .btn:active{ background:#e5e5ea; }
  .btn.key{ font-weight:600; }
  .addgrp{ display:flex; gap:7px; align-items:center; margin-top:11px; }
  .addgrp select{ flex:1; border:none; background:var(--field); border-radius:8px;
    height:38px; font-family:inherit; padding:0 10px; }
  .addgrp .btn{ background:var(--ink); color:#fff; padding:9px 15px; }

  /* ── LINE原文 ── */
  #rawText{ font-family:inherit; font-size:13px; line-height:1.75; white-space:pre-wrap;
    color:#3a3a3c; background:var(--field); border-radius:8px; padding:11px; }
  .rawnote{ display:flex; gap:6px; align-items:flex-start; margin-top:8px; }
  .rawadd{ flex:1; font-family:inherit; border:none; background:var(--field);
    border-radius:8px; padding:9px; resize:vertical; color:var(--ink); line-height:1.6; }
  .rawnote .del{ flex:0 0 20px; border:none; background:none; color:#c7c7cc;
    font-size:16px; cursor:pointer; padding-top:8px; }

  /* ── 保存バー（画面下に固定）── */
  .savebar{ position:fixed; left:0; right:0; bottom:0; padding:10px 12px 20px;
    background:rgba(242,242,247,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); }
  .savebar .inner{ max-width:480px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .savebar .status{ flex:1; font-size:12px; color:var(--sub); }
  .savebar .status.dirty{ color:var(--warn); font-weight:600; }
  .savebar .status.saved{ color:var(--ok); }
  .savebar .save{ flex:0 0 auto; border:none; border-radius:10px;
    background:var(--ink); color:#fff; font-size:15px; font-weight:600;
    font-family:inherit; padding:11px 26px; cursor:pointer; }
  .savebar .save:disabled{ opacity:.4; }

  .loading{ text-align:center; color:var(--sub); padding:40px 0; }
  .err{ background:#ffe5e5; color:#c00; border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px; }
</style>
</head>
<body>

<!-- ═══════ 画面1：案件一覧 ═══════ -->
<div id="viewList">
  <div class="head">
    <div class="ttl">
      <div class="name">案件を選ぶ</div>
      <div class="sub" id="listSub">読み込み中…</div>
    </div>
  </div>
  <div id="caseList"><div class="loading">読み込み中…</div></div>
</div>

<!-- ═══════ 画面2：アサイン ═══════ -->
<div id="viewCase" class="hide">
  <div class="head">
    <button class="back" onclick="backToList()">‹</button>
    <div class="ttl">
      <div class="name" id="hName">—</div>
      <div class="sub" id="hSub">—</div>
    </div>
  </div>

  <div id="errBox"></div>

  <!-- ① 案件設定 -->
  <div class="acc" id="acc1">
    <div class="bar" onclick="toggle('acc1')"><span class="t">① 案件設定</span><span class="arrow">▶</span></div>
    <div class="body"><div class="inner">
      <div class="hint">請求単価（クライアントへ）</div>
      <div class="row"><span class="lbl">D</span><input id="billD" type="number" inputmode="numeric" oninput="markDirty()"><span class="unit">円</span></div>
      <div class="row"><span class="lbl">AD</span><input id="billAD" type="number" inputmode="numeric" oninput="markDirty()"><span class="unit">円</span></div>
      <div class="row"><span class="lbl">ST</span><input id="billST" type="number" inputmode="numeric" oninput="markDirty()"><span class="unit">円</span></div>

      <div class="hint">払出単価（会社ごと）</div>
      <div id="payTable"></div>
      <div class="hint" style="margin-top:8px;">※ ten / next は「その他」の単価が適用されます</div>
    </div></div>
  </div>

  <!-- ② アサイン -->
  <div class="acc" id="acc2">
    <div class="bar" onclick="toggle('acc2')"><span class="t">② アサイン</span><span class="arrow">▶</span></div>
    <div class="body"><div class="inner">
      <div id="groups"></div>
      <div class="addgrp">
        <select id="newGrp">
          <option value="">大項目を追加…</option>
        </select>
        <button class="btn key" onclick="addGroup()">追加</button>
      </div>
    </div></div>
  </div>

  <!-- ③ LINE原文 -->
  <div class="acc" id="acc3">
    <div class="bar" onclick="toggle('acc3')"><span class="t">③ LINE原文</span><span class="arrow">▶</span></div>
    <div class="body"><div class="inner">
      <div id="rawText">—</div>
      <div id="rawNotes"></div>
      <button class="btn key" onclick="addRawNote()" style="margin-top:8px;">＋ 追加文章</button>
    </div></div>
  </div>

  <!-- 保存バー -->
  <div class="savebar">
    <div class="inner">
      <span class="status" id="saveStatus">—</span>
      <button class="save" id="saveBtn" onclick="save()">保存</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
 *  設定
 * ══════════════════════════════════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzX7Pzhq2TFFOHCr0saeHG7qeWA5PuBptUe4-kAtzj-kYWIkJE7z7F1vkvkAMEUzQpPcA/exec';

// 会社リスト（アサインで選べる6つ）
const COMPANIES = ['自社','ZERO','ten','next','ハン','その他'];
// 払出単価表の会社（4つ。ten/next は「その他」に内包）
const PAY_COMPANIES = ['自社','ZERO','ハン','その他'];
const ROLES = ['D','AD','ST'];

// 大項目の候補
const POS_OPTIONS = ['クローク','受付','ドリンク補充','誘導','着替えテント',
                     'ウォーミングアップ','応援席','環境整理','インフォ','パスコントロール'];

/* ══════════════════════════════════════════
 *  状態（ローカルで全部持つ＝ラグゼロ）
 * ══════════════════════════════════════════ */
let CASES = [];        // 案件一覧
let CURRENT = null;    // 選択中の案件 {ssId, tabName, caseName...}
let DATA = null;       // 読み込んだ案件データ
let DIRTY = false;     // 未保存の変更があるか
let SAVING = false;
let autoTimer = null;

/* ══════════════════════════════════════════
 *  GAS通信
 * ══════════════════════════════════════════ */
async function callGas(payload){
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },   // CORS回避
    redirect: 'follow',
    body: JSON.stringify(payload),
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '不明なエラー');
  return json;
}

/* ══════════════════════════════════════════
 *  画面1：案件一覧
 * ══════════════════════════════════════════ */
async function loadCaseList(){
  try{
    const r = await callGas({ action:'getCaseList' });
    CASES = r.cases || [];
    renderCaseList();
  }catch(e){
    document.getElementById('caseList').innerHTML =
      '<div class="err">案件の読み込みに失敗しました<br>'+e.message+'</div>';
    document.getElementById('listSub').textContent = 'エラー';
  }
}

function renderCaseList(){
  const wrap = document.getElementById('caseList');
  document.getElementById('listSub').textContent = CASES.length + '件';

  if(CASES.length === 0){
    wrap.innerHTML = '<div class="loading">案件がありません</div>';
    return;
  }
  wrap.innerHTML = CASES.map((c,i)=>
    '<div class="caseItem" onclick="openCase('+i+')">'+
      '<div class="cn">'+esc(c.caseName)+'</div>'+
      '<div class="cd">'+esc(c.dates)+(c.area?' ／ '+esc(c.area):'')+'</div>'+
      '<div class="cc">'+esc(c.client)+'</div>'+
    '</div>'
  ).join('');
}

/* ══════════════════════════════════════════
 *  画面2：案件を開く
 * ══════════════════════════════════════════ */
async function openCase(i){
  CURRENT = CASES[i];
  show('viewCase');
  document.getElementById('hName').textContent = CURRENT.caseName;
  document.getElementById('hSub').textContent = CURRENT.dates + ' ／ ' + CURRENT.time;
  document.getElementById('errBox').innerHTML = '';
  setStatus('読み込み中…');

  try{
    const r = await callGas({ action:'getCase', ssId:CURRENT.ssId, tabName:CURRENT.tabName });
    DATA = r.data;
    buildUI();
    DIRTY = false;
    setStatus('保存済み', 'saved');
  }catch(e){
    document.getElementById('errBox').innerHTML =
      '<div class="err">読み込みに失敗しました<br>'+e.message+'</div>';
    setStatus('エラー');
  }
}

function backToList(){
  if(DIRTY && !confirm('未保存の変更があります。破棄して戻りますか？')) return;
  clearAuto();
  DIRTY = false;
  show('viewList');
}

/* ══════════════════════════════════════════
 *  UIを組み立てる
 * ══════════════════════════════════════════ */
function buildUI(){
  const s = DATA.settings;

  // ① 請求単価
  document.getElementById('billD').value  = s.bill.D  || '';
  document.getElementById('billAD').value = s.bill.AD || '';
  document.getElementById('billST').value = s.bill.ST || '';

  // ① 払出単価テーブル
  let html = '<div class="payhead"><span class="pco"></span>'+
             ROLES.map(r=>'<span class="pcol">'+r+'</span>').join('')+'</div>';
  PAY_COMPANIES.forEach(co=>{
    html += '<div class="payrow3"><span class="pco">'+co+'</span>';
    ROLES.forEach(role=>{
      const v = (s.pay[co] && s.pay[co][role]) ? s.pay[co][role] : '';
      html += '<input class="paycell" type="number" inputmode="numeric" '+
              'data-co="'+co+'" data-role="'+role+'" value="'+v+'" '+
              'placeholder="¥" oninput="onPayInput()">';
    });
    html += '</div>';
  });
  document.getElementById('payTable').innerHTML = html;

  // ② 大項目の選択肢
  const sel = document.getElementById('newGrp');
  sel.innerHTML = '<option value="">大項目を追加…</option>' +
    POS_OPTIONS.map(p=>'<option>'+p+'</option>').join('');

  // ② アサイン（slotsを大項目ごとにまとめる）
  buildGroups();

  // ③ LINE原文
  document.getElementById('rawText').textContent = DATA.rawText || '（原文なし）';
  document.getElementById('rawNotes').innerHTML = '';
}

// slots（1枠1日）→ 画面用（1枠にまとめる。稼働日も復元）
function buildGroups(){
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '';

  // 日付リスト
  const dates = [];
  DATA.slots.forEach(s=>{ if(s.date && dates.indexOf(s.date)<0) dates.push(s.date); });
  DATA._dates = dates;

  // 「大項目 → 枠」にまとめる（同じ role|name|company を1枠）
  const byPos = {};
  DATA.slots.forEach(s=>{
    if(!byPos[s.pos]) byPos[s.pos] = {};
    const key = s.role+'|'+s.name+'|'+s.company;
    if(!byPos[s.pos][key]){
      byPos[s.pos][key] = { role:s.role, name:s.name, company:s.company, dates:[] };
    }
    // その枠が稼働している日を集める
    if(s.date && byPos[s.pos][key].dates.indexOf(s.date)<0){
      byPos[s.pos][key].dates.push(s.date);
    }
  });

  Object.keys(byPos).forEach(pos=>{
    const grp = makeGroup(pos);
    wrap.appendChild(grp);
    const gbody = grp.querySelector('.gbody');
    const addbar = gbody.querySelector('.addbar');
    Object.keys(byPos[pos]).forEach(k=>{
      const sl = byPos[pos][k];
      gbody.insertBefore(
        makeSlot(sl.role||'ST', sl.name, sl.company||'自社', sl.dates),
        addbar
      );
    });
    reorder(gbody);
  });
}

function makeGroup(name){
  const grp = document.createElement('div');
  grp.className = 'grp';
  grp.innerHTML =
    '<div class="gbar" onclick="toggleGrp(this)">'+
      '<span class="gname">'+esc(name)+'</span>'+
      '<span class="gright"><span class="gcount">ST 0名</span><span class="garrow">▾</span></span>'+
    '</div>'+
    '<div class="gbody">'+
      '<div class="addbar">'+
        '<button class="btn" onclick="addSlot(this,\'D\')">＋D</button>'+
        '<button class="btn" onclick="addSlot(this,\'AD\')">＋AD</button>'+
        '<button class="btn key" onclick="addSlot(this,\'ST\')">＋ST</button>'+
      '</div>'+
    '</div>';
  return grp;
}

function makeSlot(role, name, co, dateSet){
  const div = document.createElement('div');
  div.className = 'slot';

  // 稼働日：指定がなければ全日ON（デフォルト）
  const dates = DATA._dates || [];
  const on = dateSet || dates.slice();   // 未指定なら全部

  let dayHtml = '';
  if (dates.length > 1) {   // 1日だけの案件はチェックを出さない（選ぶ意味がない）
    dayHtml = '<div class="days">' + dates.map(d=>
      '<label class="day"><input type="checkbox" data-date="'+esc(d)+'"'+
      (on.indexOf(d)>=0?' checked':'')+' onchange="markDirty()">'+
      '<span>'+esc(d)+'</span></label>'
    ).join('') + '</div>';
  } else {
    // 1日案件でも、内部的には全日ONとして扱う
    dayHtml = '<div class="days hide">' + dates.map(d=>
      '<input type="checkbox" data-date="'+esc(d)+'" checked>'
    ).join('') + '</div>';
  }

  div.innerHTML =
    '<div class="slotmain">'+
      '<span class="rtag">'+role+'</span>'+
      '<select class="role" onchange="onRole(this)">'+
        ROLES.map(r=>'<option'+(r===role?' selected':'')+'>'+r+'</option>').join('')+
      '</select>'+
      '<input class="nm" placeholder="名前（後で可）" value="'+esc(name||'')+'" oninput="markDirty()">'+
      '<select class="co" onchange="onCo(this)">'+
        COMPANIES.map(c=>'<option'+(c===co?' selected':'')+'>'+c+'</option>').join('')+
      '</select>'+
      '<span class="paytag">—</span>'+
      '<button class="del" onclick="delSlot(this)">×</button>'+
    '</div>' + dayHtml;

  setTimeout(()=>updatePay(div),0);
  return div;
}

/* ══════════════════════════════════════════
 *  アサイン操作
 * ══════════════════════════════════════════ */
function addSlot(btn, role){
  const gbody = btn.closest('.gbody');
  gbody.insertBefore(makeSlot(role,'','自社',null), gbody.querySelector('.addbar'));
  reorder(gbody); markDirty();
}
function delSlot(btn){
  const gbody = btn.closest('.gbody');
  btn.closest('.slot').remove();
  reorder(gbody); markDirty();
}
function onRole(sel){
  const slot = sel.closest('.slot');
  reorder(sel.closest('.gbody'));
  updatePay(slot); markDirty();
}
function onCo(sel){ updatePay(sel.closest('.slot')); markDirty(); }

function addGroup(){
  const sel = document.getElementById('newGrp');
  const name = sel.value; if(!name) return;
  const grp = makeGroup(name);
  document.getElementById('groups').appendChild(grp);
  const gbody = grp.querySelector('.gbody');
  gbody.insertBefore(makeSlot('ST','','自社',null), gbody.querySelector('.addbar'));
  reorder(gbody); sel.value=''; markDirty();
}

function toggleGrp(bar){ bar.closest('.grp').classList.toggle('closed'); }

// D→AD→ST順に並べ替え＆ST採番＆人数カウント
function reorder(gbody){
  const slots = Array.from(gbody.querySelectorAll('.slot'));
  const addbar = gbody.querySelector('.addbar');
  const rank = r => r==='D'?0 : r==='AD'?1 : 2;
  slots.sort((a,b)=> rank(a.querySelector('.role').value) - rank(b.querySelector('.role').value));

  let st=0;
  slots.forEach(s=>{
    gbody.insertBefore(s, addbar);
    const role = s.querySelector('.role').value;
    const tag = s.querySelector('.rtag');
    if(role==='ST'){ st++; tag.textContent='ST'+st; }
    else tag.textContent = role;
  });
  gbody.closest('.grp').querySelector('.gcount').textContent = 'ST '+st+'名';
}

// 払出単価を表示（会社×役割。ten/nextは「その他」）
function updatePay(slot){
  const role = slot.querySelector('.role').value;
  const co   = slot.querySelector('.co').value;
  const payCo = (PAY_COMPANIES.indexOf(co) >= 0) ? co : 'その他';
  const cell = document.querySelector('.paycell[data-co="'+payCo+'"][data-role="'+role+'"]');
  const v = cell && cell.value ? Number(cell.value) : null;
  slot.querySelector('.paytag').textContent = (v!=null) ? '¥'+v.toLocaleString() : '—';
}
function onPayInput(){
  document.querySelectorAll('.slot').forEach(updatePay);
  markDirty();
}

/* ══════════════════════════════════════════
 *  LINE原文の追記
 * ══════════════════════════════════════════ */
function addRawNote(){
  const wrap = document.getElementById('rawNotes');
  const div = document.createElement('div');
  div.className='rawnote';
  div.innerHTML =
    '<textarea class="rawadd" rows="3" placeholder="追加メモ・補足…" oninput="markDirty()"></textarea>'+
    '<button class="del" onclick="this.parentElement.remove(); markDirty();">×</button>';
  wrap.appendChild(div);
}

/* ══════════════════════════════════════════
 *  保存（ラグゼロ：ローカル即反映→裏で保存）
 * ══════════════════════════════════════════ */
function collectPayload(){
  // ① 設定
  const bill = {
    D:  document.getElementById('billD').value,
    AD: document.getElementById('billAD').value,
    ST: document.getElementById('billST').value,
  };
  const pay = {};
  PAY_COMPANIES.forEach(co=>{
    pay[co] = {};
    ROLES.forEach(role=>{
      const c = document.querySelector('.paycell[data-co="'+co+'"][data-role="'+role+'"]');
      pay[co][role] = c ? c.value : '';
    });
  });

  // ② アサイン（チェックされた日だけ展開）
  //    ★名前が空でもOK（会社だけ決まっている＝外注に渡した状態）
  const slots = [];
  const baseTime = (DATA.settings.time || '').split('〜');
  const defStart = (baseTime[0] || '').trim();
  const defEnd   = (baseTime[1] || '').trim();

  document.querySelectorAll('.grp').forEach(grp=>{
    const pos = grp.querySelector('.gname').textContent;
    grp.querySelectorAll('.slot').forEach(sl=>{
      const role = sl.querySelector('.role').value;
      const name = sl.querySelector('.nm').value.trim();
      const co   = sl.querySelector('.co').value;

      // チェックが入っている日だけ
      const days = Array.from(sl.querySelectorAll('input[type=checkbox]'))
        .filter(cb => cb.checked)
        .map(cb => cb.dataset.date);

      days.forEach(dt=>{
        slots.push({ date:dt, pos:pos, role:role, name:name, company:co,
                     start:defStart, end:defEnd, note:'' });
      });
    });
  });

  // ③ 追記
  const notes = Array.from(document.querySelectorAll('.rawadd'))
    .map(t=>t.value.trim()).filter(v=>v);
  const rawAdd = notes.join('\n');

  return { settings:{ bill, pay }, slots, rawAdd };
}

async function save(silent){
  if(SAVING || !CURRENT) return;
  SAVING = true;
  document.getElementById('saveBtn').disabled = true;
  setStatus('保存中…');

  try{
    const payload = collectPayload();
    await callGas({ action:'saveCase', ssId:CURRENT.ssId, tabName:CURRENT.tabName, payload });
    DIRTY = false;
    setStatus('保存済み', 'saved');
    // 追記は保存したらクリア（二重投稿を防ぐ）
    document.getElementById('rawNotes').innerHTML = '';
  }catch(e){
    setStatus('保存失敗', 'dirty');
    if(!silent) alert('保存に失敗しました\n'+e.message);
  }finally{
    SAVING = false;
    document.getElementById('saveBtn').disabled = false;
  }
}

function markDirty(){
  DIRTY = true;
  setStatus('未保存の変更あり', 'dirty');
  scheduleAuto();
}

// 30秒後に自動保存
function scheduleAuto(){
  clearAuto();
  autoTimer = setTimeout(()=>{ if(DIRTY) save(true); }, 30000);
}
function clearAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }

function setStatus(text, cls){
  const el = document.getElementById('saveStatus');
  el.textContent = text;
  el.className = 'status' + (cls ? ' '+cls : '');
}

// 離脱警告
window.addEventListener('beforeunload', e=>{
  if(DIRTY){ e.preventDefault(); e.returnValue = ''; }
});

/* ══════════════════════════════════════════
 *  共通
 * ══════════════════════════════════════════ */
function toggle(id){ document.getElementById(id).classList.toggle('open'); }
function show(id){
  ['viewList','viewCase'].forEach(v=>{
    document.getElementById(v).classList.toggle('hide', v!==id);
  });
  window.scrollTo(0,0);
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

loadCaseList();
